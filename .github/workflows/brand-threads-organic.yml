name: ブランド別 Threads 通常投稿（手動・dry-run優先）
on:
  workflow_dispatch:
    inputs:
      brand:
        description: '投稿先ブランド'
        required: true
        type: choice
        options:
          - rakutabi
          - lens
      day:
        description: '通常投稿番号'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      publish:
        description: '実投稿（初回検証後のみ）'
        required: true
        type: boolean
        default: false
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: brand-threads-${{ inputs.brand }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 通常投稿のドライラン
        if: ${{ !inputs.publish }}
        run: node scripts/post-organic-threads.mjs --brand "${{ inputs.brand }}" --day "${{ inputs.day }}"
      - name: 認証アカウントを検証して通常投稿
        if: ${{ inputs.publish }}
        env:
          RAKUTABI_THREADS_USER_ID: ${{ secrets.RAKUTABI_THREADS_USER_ID }}
          RAKUTABI_THREADS_ACCESS_TOKEN: ${{ secrets.RAKUTABI_THREADS_ACCESS_TOKEN }}
          LENS_THREADS_USER_ID: ${{ secrets.LENS_THREADS_USER_ID }}
          LENS_THREADS_ACCESS_TOKEN: ${{ secrets.LENS_THREADS_ACCESS_TOKEN }}
          ENABLE_ORGANIC_THREADS_PUBLISH: 'true'
        run: node scripts/post-organic-threads.mjs --brand "${{ inputs.brand }}" --day "${{ inputs.day }}" --publish
