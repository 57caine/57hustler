name: CEO HOME assets browser verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/ceo-home-assets-e2e.mjs'
      - '.github/workflows/ceo-home-assets-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ceo-home-test-account
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/ceo-home-e2e"
          npm install --prefix "$RUNNER_TEMP/ceo-home-e2e" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/ceo-home-e2e/node_modules/.bin/playwright" install --with-deps chromium
          cp tests/ceo-home-assets-e2e.mjs "$RUNNER_TEMP/ceo-home-e2e/verify.mjs"
      - name: Verify authenticated browser flow and cleanup
        run: node "$RUNNER_TEMP/ceo-home-e2e/verify.mjs"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RLS_TEST_USER1_EMAIL: ${{ secrets.RLS_TEST_USER1_EMAIL }}
          RLS_TEST_USER1_PASSWORD: ${{ secrets.RLS_TEST_USER1_PASSWORD }}
