name: 一時調査・lens-navi トップページ本番確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 本番URLをcurlで確認
        run: |
          curl -sSL -D - -o /tmp/body.html https://lens-navi.jp/
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/body.html || true
          echo "=== ヒーローの見出しテキスト ==="
          grep -o "目の悩みに寄り添う" /tmp/body.html || echo "見つかりませんでした"
          echo "=== カテゴリグリッド（すべて見る）==="
          grep -o "すべて見る" /tmp/body.html || echo "見つかりませんでした"
          echo "=== 商品名（6件） ==="
          for name in "ワンデーアキュビューモイスト" "エバーカラー ワンデー ナチュラル" "Zoff CLASSIC" "メガネの上から偏光サングラス" "アイリスCL-I ネオ" "リリースアイ"; do
            echo -n "$name: "
            grep -q "$name" /tmp/body.html && echo "OK" || echo "見つかりません"
          done
          echo "=== ヒーロー画像パス ==="
          grep -o '/images/hero/hero-woman[^"]*' /tmp/body.html || echo "見つかりませんでした"
