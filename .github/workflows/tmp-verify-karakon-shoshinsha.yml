name: 一時確認-カラコン初心者ガイドの表示確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production page and inspect
        run: |
          URL="https://lens-navi.jp/column/karakon-shoshinsha-guide"
          echo "Fetching: $URL"
          START=$(date +%s%N)
          HTTP_CODE=$(curl -sL -o /tmp/page.html -w "%{http_code}" -D /tmp/headers.txt "$URL")
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "HTTP status: $HTTP_CODE"
          echo "Elapsed: ${ELAPSED_MS}ms"
          echo "File size: $(wc -c < /tmp/page.html) bytes"
          echo ""
          echo "=== レスポンスヘッダー（リダイレクト履歴含む） ==="
          cat /tmp/headers.txt
          echo ""
          echo "=== エラー兆候の確認 ==="
          grep -o "Application error\|500 Internal\|This page could not be found\|__next_error__" /tmp/page.html || echo "エラー文言なし"
          echo ""
          echo "=== titleタグの確認 ==="
          grep -o "<title>[^<]*</title>" /tmp/page.html
          echo ""
          echo "=== リダイレクトのみ追跡なしでの直接確認（-Lなし） ==="
          HTTP_CODE_NOFOLLOW=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status (no -L): $HTTP_CODE_NOFOLLOW"
          echo ""
          echo "=== 先頭2500文字 ==="
          head -c 2500 /tmp/page.html
          echo ""
          echo ""
          echo "=== H2見出しの出現確認 ==="
          grep -o "カラコン選びの基本\|カラコン人気ランキング\|度あり\|度数" /tmp/page.html | sort | uniq -c
