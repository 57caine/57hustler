name: tmp-verify-logout
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check logout button is now outside the scrolling nav links container
        run: |
          DOMAIN="https://ceo-dashboard-alpha-livid.vercel.app"
          curl -sS -o /tmp/login.html -w "HTTP %{http_code}\n" "${DOMAIN}/login"
          echo "--- logout button text present? ---"
          grep -oc "ログアウト" /tmp/login.html || echo 0
          echo "--- full nav markup (first 1000 chars) ---"
          grep -oE '<nav[^>]*>.{0,1000}' /tmp/login.html | head -1
