name: 一時取得-ソフトハード比較記事のGA4個別メトリクス

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch metrics for soft-vs-hard-contact-hikaku
        run: npx tsx scripts/tmp-fetch-soft-hard-metrics.ts
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
