name: 仕組み名鑑 自動索引更新

on:
  # 2026-09-22 一時停止: scripts/・.github/workflows/への全pushで発火する仕様のため、
  # 開発セッション中に高頻度の自動コミットが発生し、Vercelの同時ビルド枠を圧迫して
  # CEOダッシュボード等のデプロイがBlocked状態で滞留する一因になっていた（オーナー承認済み）。
  # 再開する場合はこのコメントを外し、push トリガーを復元すること。
  # push:
  #   branches: [main]
  #   paths:
  #     - 'scripts/**'
  #     - '.github/workflows/**'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 索引を生成
        run: npx ts-node scripts/generate-index.ts

      - name: 索引をコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/system-index.json
          git diff --staged --quiet || git commit -m "chore: 仕組み名鑑を自動更新"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
