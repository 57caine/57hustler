name: Threads fortune status PR check
on:
  pull_request:
    paths:
      - 'scripts/post-threads-fortune.ts'
      - 'scripts/tests/threads-fortune-status.test.mjs'
      - '.github/workflows/threads-fortune-status-pr-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/threads-fortune-status.test.mjs
