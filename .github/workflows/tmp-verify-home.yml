name: tmp-verify-home
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch build events for the canceled fa06d3b deployment
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v3/deployments/dpl_YCrGej8uKD5edcMnddX6qmZKKPjg/events?builds=1" > /tmp/events.json
          node -e "
            const fs = require('fs');
            const events = JSON.parse(fs.readFileSync('/tmp/events.json', 'utf8'));
            const arr = Array.isArray(events) ? events : (events.events || []);
            for (const e of arr) {
              if (e.text) console.log('[' + (e.type||'') + ']', e.text);
            }
          "
