name: Threads 占い 日次自動投稿

on:
  # 昼コラムの代わりに九星別運勢を毎日12:00 JSTに投稿。夜コラムは維持。
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 占い投稿
        run: npx ts-node scripts/post-threads-fortune.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: 投稿履歴をコミット（重複投稿防止用）
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/yonaka-fortune-history.json
          git diff --staged --quiet || git commit -m "chore: Threads占い投稿履歴更新 $(date '+%Y-%m-%d')"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
