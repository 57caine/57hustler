name: 一時確認-コラム改善レビュー3件の本番反映確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ranshi-contact-ranking-2025
        run: |
          URL="https://lens-navi.jp/column/ranshi-contact-ranking-2025"
          echo "Fetching: $URL"
          HTTP_CODE=$(curl -sL -o /tmp/ranshi.html -w "%{http_code}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          echo "=== 商品名入りCTAボタンの出現確認 ==="
          grep -o "デイリーズ トータルワン 乱視用を楽天で見る\|アキュビュー オアシス 乱視用を楽天で見る\|バイオフィニティ トーリックを楽天で見る" /tmp/ranshi.html | sort | uniq -c
          echo "=== rel=sponsored確認 ==="
          grep -o 'rel="noopener noreferrer nofollow sponsored"' /tmp/ranshi.html | wc -l

      - name: Verify sunglass-polarized-guide
        run: |
          URL="https://lens-navi.jp/column/sunglass-polarized-guide"
          echo "Fetching: $URL"
          HTTP_CODE=$(curl -sL -o /tmp/sunglass.html -w "%{http_code}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          echo "=== 新デザイン（バッジ付きカード）の出現確認 ==="
          grep -o "釣り向け\|ドライブ向け\|スキー・スノーボード向け\|サイクリング・ランニング向け" /tmp/sunglass.html | sort | uniq -c
          echo "=== rel=sponsored確認 ==="
          grep -o 'rel="noopener noreferrer nofollow sponsored"' /tmp/sunglass.html | wc -l

      - name: Verify eye-roller-fatigue-puffiness
        run: |
          URL="https://lens-navi.jp/column/eye-roller-fatigue-puffiness"
          echo "Fetching: $URL"
          HTTP_CODE=$(curl -sL -o /tmp/roller.html -w "%{http_code}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          echo "=== 新リード文の出現確認 ==="
          grep -o "結論から言うと、アイローラーは医療機器のような効果が証明されているわけではありませんが" /tmp/roller.html | wc -l
          echo "=== 旧リード文が残っていないか確認 ==="
          grep -o "この記事ではおすすめ製品と選び方、使い方を紹介します" /tmp/roller.html | wc -l || echo "0"
