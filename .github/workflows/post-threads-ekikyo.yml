name: Threads 今日の易経 自動投稿

on:
  schedule:
    # 毎日 JST 22:30 (UTC 13:30)。対象曜日（月・水・金）判定はスクリプト内部で実施
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 今日の易経 投稿
        run: npx ts-node scripts/post-threads-ekikyo.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
