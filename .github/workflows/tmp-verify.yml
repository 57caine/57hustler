name: tmp-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: curl production homepage
        run: |
          curl -s "https://www.lens-navi.jp/" -o /tmp/body.html
          echo "---HERO / SEARCH / BANNERS---"
          grep -qF 'コラムを読む' /tmp/body.html && echo "FOUND: hero secondary CTA (コラムを読む)" || echo "MISSING: hero secondary CTA"
          grep -qF '商品・コラムを検索' /tmp/body.html && echo "FOUND: search box placeholder" || echo "MISSING: search box placeholder"
          echo "bg-navy-900 count: $(grep -o 'bg-navy-900' /tmp/body.html | wc -l)"
          echo "bg-\\[#bf0000\\] count (should be 0 on homepage): $(grep -o 'bg-\[#bf0000\]' /tmp/body.html | wc -l)"
          echo "---FOOTER---"
          curl -s "https://www.lens-navi.jp/" | grep -o 'bg-navy-950' | wc -l | xargs -I{} echo "bg-navy-950 count: {}"

      - name: Vercel usage lookup (best effort)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_3ZA38DTbe02rLyjHXAaNuCs5
        run: |
          echo "--- v1/teams/{id}/usage ---"
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/teams/$TEAM_ID/usage" | head -c 3000
          echo
          echo "--- v1/billing/usage (team scoped) ---"
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/billing/usage?teamId=$TEAM_ID" | head -c 3000
          echo
          echo "--- v1/teams/{id}/billing ---"
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/teams/$TEAM_ID/billing" | head -c 3000
          echo
          echo "--- v1/teams/{id}/spend ---"
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/teams/$TEAM_ID/spend" | head -c 3000
