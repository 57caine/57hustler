name: tmp-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@latest > /dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Check actual image load in a real browser
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 2000 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push('pageerror: ' + err.message));
            await page.goto('https://www.lens-navi.jp/', { waitUntil: 'networkidle', timeout: 30000 });

            const results = await page.evaluate(() => {
              const imgs = Array.from(document.querySelectorAll('img[src*="thumbnail.image.rakuten.co.jp"]'));
              return imgs.map(img => ({
                alt: img.alt,
                src: img.src,
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                displayedWidth: img.clientWidth,
                displayedHeight: img.clientHeight,
                visible: img.offsetParent !== null,
              }));
            });
            console.log('=== Featured product <img> load status (real Chromium) ===');
            console.log(JSON.stringify(results, null, 2));

            console.log('=== Console errors during load ===');
            console.log(consoleErrors.length ? consoleErrors.join('\n') : '(none)');

            await page.screenshot({ path: 'featured.png', clip: { x: 0, y: 1200, width: 1280, height: 500 } });
            await browser.close();
          })();
          EOF
          node check.js
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: featured-products-screenshot
          path: featured.png
