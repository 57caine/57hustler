name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Full content check of new CEO dashboard pages
        run: |
          DOMAIN="https://ceo-dashboard-alpha-livid.vercel.app"
          check_page () {
            local path="$1"
            echo "=========================================="
            echo "PAGE: $path"
            curl -sS -o /tmp/page.html -w "HTTP_STATUS:%{http_code}\n" "${DOMAIN}${path}"
            grep -oE '/_next/static/chunks/[a-zA-Z0-9_./-]+\.js' /tmp/page.html | sort -u > /tmp/chunks.txt
            : > /tmp/bundle_all.js
            while read -r chunk; do
              curl -sS "${DOMAIN}${chunk}" >> /tmp/bundle_all.js 2>/dev/null || true
              echo "" >> /tmp/bundle_all.js
            done < /tmp/chunks.txt
          }

          check_page "/today"
          for s in "今日やることTOP3" "ユーザー判断待ち" "AI作業待ち" "現在の収益状況"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/projects"
          for s in "全" "プロジェクト" "稼働中" "停止中" "レンズナビ" "楽旅くん" "ペット避難" "出口のノート"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/projects/lens-navi"
          for s in "目的" "現在の状態" "ファネル" "次のアクション" "担当AI"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/money"
          for s in "収益ダッシュボード" "今月収益" "クリック" "収集前"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/ai-team"
          for s in "ChatGPT" "Gemini" "手動で更新"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/pdca"
          for s in "仮説" "実行" "結果" "改善案" "次のアクション"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          check_page "/alert"
          for s in "自動検知" "長期間停滞" "未更新" "KPI悪化"; do
            cnt=$(grep -oF "$s" /tmp/bundle_all.js | wc -l); echo "  [$s]: $cnt"
          done

          echo "=========================================="
          echo "REDIRECTS"
          for p in "/" "/column-review" "/tasks" "/report-log" "/analytics"; do
            loc=$(curl -sS -o /dev/null -D - "${DOMAIN}${p}" | grep -i "^location" | tr -d '\r')
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${DOMAIN}${p}")
            echo "  $p -> $code $loc"
          done
