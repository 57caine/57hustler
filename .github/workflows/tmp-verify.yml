name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Debug /today page specifically
        run: |
          DOMAIN="https://ceo-dashboard-alpha-livid.vercel.app"
          curl -sS -o /tmp/today.html -w "HTTP_STATUS:%{http_code}\n" "${DOMAIN}/today"
          echo "--- page.html size ---"
          wc -c /tmp/today.html
          echo "--- chunks referenced ---"
          grep -oE '/_next/static/chunks/[a-zA-Z0-9_./-]+\.js' /tmp/today.html | sort -u
          echo "--- inline script check for TODAY text (in raw page.html itself) ---"
          grep -oF "TODAY" /tmp/today.html | wc -l
          grep -oF "今日" /tmp/today.html | wc -l
          echo "--- nav labels (should be same across all pages, sanity check) ---"
          grep -oF "57hustler" /tmp/today.html | wc -l
          echo "--- fetch all chunks and grep ---"
          : > /tmp/bundle.js
          for c in $(grep -oE '/_next/static/chunks/[a-zA-Z0-9_./-]+\.js' /tmp/today.html | sort -u); do
            curl -sS "${DOMAIN}${c}" >> /tmp/bundle.js
            echo "" >> /tmp/bundle.js
          done
          wc -c /tmp/bundle.js
          echo "--- any Japanese text sample from bundle ---"
          grep -oP '[\x{3040}-\x{30FF}\x{4E00}-\x{9FFF}]{2,}' /tmp/bundle.js | sort -u | head -30
