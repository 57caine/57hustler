name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Find earliest BLOCKED deployment for lens-navi
        run: |
          SINCE=$(node -e "console.log(Date.parse('2026-09-14T00:00:00Z'))")
          UNTIL=$(node -e "console.log(Date.parse('2026-09-22T00:00:00Z'))")
          echo "Querying BLOCKED deployments 09/14-09/22 (paginating back with 'until')..."
          NEXT_UNTIL=$UNTIL
          for i in 1 2 3 4 5 6 7 8; do
            echo "--- page $i, until=$NEXT_UNTIL ($(node -e "console.log(new Date($NEXT_UNTIL).toISOString())")) ---"
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=prj_giumlnQKdnPBBAKU6l5t81ol54AV&limit=100&since=$SINCE&until=$NEXT_UNTIL")
            echo "$RESP" | node -e "
              let data = '';
              process.stdin.on('data', d => data += d);
              process.stdin.on('end', () => {
                const json = JSON.parse(data);
                if (json.error) { console.log('ERROR:', JSON.stringify(json.error)); process.exit(1); }
                const deployments = json.deployments || [];
                console.log('count:', deployments.length);
                for (const d of deployments) {
                  const created = new Date(d.created || d.createdAt).toISOString();
                  console.log(created, d.state, d.target, d.meta && d.meta.githubCommitMessage ? d.meta.githubCommitMessage.split('\n')[0] : '');
                }
                if (json.pagination && json.pagination.next) {
                  console.log('NEXT_TIMESTAMP', json.pagination.next);
                } else if (deployments.length > 0) {
                  console.log('NEXT_TIMESTAMP', deployments[deployments.length - 1].created || deployments[deployments.length-1].createdAt);
                } else {
                  console.log('NEXT_TIMESTAMP', 'NONE');
                }
              });
            " > /tmp/page_output.txt
            cat /tmp/page_output.txt
            NEW_UNTIL=$(grep NEXT_TIMESTAMP /tmp/page_output.txt | awk '{print $2}')
            if [ "$NEW_UNTIL" = "NONE" ] || [ -z "$NEW_UNTIL" ]; then
              echo "No more pages, stopping."
              break
            fi
            if [ "$NEW_UNTIL" = "$NEXT_UNTIL" ]; then
              echo "Same timestamp returned, stopping to avoid infinite loop."
              break
            fi
            NEXT_UNTIL=$NEW_UNTIL
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
