name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Debug /today RSC payload
        run: |
          DOMAIN="https://ceo-dashboard-alpha-livid.vercel.app"
          curl -sS -o /tmp/today.html "${DOMAIN}/today"
          echo "--- ASCII markers (href targets, hrefs to sibling pages) ---"
          for s in "/alert" "/money" "/projects" "/ai-team" "TOP3" "u4eca" "u65e5"; do
            cnt=$(grep -oF "$s" /tmp/today.html | wc -l)
            echo "  [$s]: $cnt"
          done
          echo "--- self.__next_f push block count ---"
          grep -oF "self.__next_f.push" /tmp/today.html | wc -l
          echo "--- raw snippet around first occurrence of 4eca (unicode for 今) ---"
          python3 -c "
data = open('/tmp/today.html', encoding='utf-8', errors='replace').read()
idx = data.find('4eca')
print('idx:', idx)
if idx >= 0:
    print(data[max(0,idx-200):idx+200])
else:
    print('not found, dumping first 2000 chars of body:')
    bidx = data.find('<body')
    print(data[bidx:bidx+2000] if bidx>=0 else data[:2000])
"
