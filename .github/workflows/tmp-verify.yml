name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ga4 client
        run: npm i --no-save @google-analytics/data

      - name: Compare true site-wide 28-day sessions vs top-20-page-sum
        run: |
          cat > ./tmp-ga4-check.mjs <<'EOF'
          import { BetaAnalyticsDataClient } from '@google-analytics/data';

          const credentials = JSON.parse(process.env.GA4_SERVICE_ACCOUNT_KEY);
          const client = new BetaAnalyticsDataClient({ credentials });
          const propertyId = '520238223'; // lens-navi

          // 1. True site-wide total sessions, no dimension
          const [totalResp] = await client.runReport({
            property: `properties/${propertyId}`,
            dimensions: [],
            metrics: [{ name: 'sessions' }],
            dateRanges: [{ startDate: '28daysAgo', endDate: 'today' }],
          });
          console.log('=== True site-wide sessions (no dimension) ===');
          console.log(JSON.stringify(totalResp.rows, null, 2));

          // 2. Distinct pagePath count + sum of top 20 vs sum of ALL pages
          const [pagesResp] = await client.runReport({
            property: `properties/${propertyId}`,
            dimensions: [{ name: 'pagePath' }],
            metrics: [{ name: 'sessions' }],
            dateRanges: [{ startDate: '28daysAgo', endDate: 'today' }],
            orderBys: [{ metric: { metricName: 'sessions' }, desc: true }],
            limit: 1000,
          });
          const rows = pagesResp.rows ?? [];
          console.log('=== distinct pagePath rows (up to 1000) ===');
          console.log('total distinct pages:', rows.length);
          const allSum = rows.reduce((s, r) => s + parseInt(r.metricValues[0].value), 0);
          const top20Sum = rows.slice(0, 20).reduce((s, r) => s + parseInt(r.metricValues[0].value), 0);
          console.log('sum of ALL pages sessions:', allSum);
          console.log('sum of TOP 20 pages sessions:', top20Sum);
          console.log('difference (long-tail beyond top20):', allSum - top20Sum);

          // 3. sessionDefaultChannelGroup breakdown for sanity
          const [chResp] = await client.runReport({
            property: `properties/${propertyId}`,
            dimensions: [{ name: 'sessionDefaultChannelGroup' }],
            metrics: [{ name: 'sessions' }],
            dateRanges: [{ startDate: '28daysAgo', endDate: 'today' }],
            orderBys: [{ metric: { metricName: 'sessions' }, desc: true }],
          });
          console.log('=== by channel group ===');
          for (const r of (chResp.rows ?? [])) {
            console.log(r.dimensionValues[0].value, r.metricValues[0].value);
          }
          EOF
          node ./tmp-ga4-check.mjs
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
