name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Find ceo-dashboard project domains + latest deployment
        run: |
          echo "--- domains for ceo-dashboard project ---"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_B033Bkfsk6LkJZNxS61Gc4Xvddva/domains" | node -e "
              let data=''; process.stdin.on('data', d => data+=d); process.stdin.on('end', () => {
                const j = JSON.parse(data);
                console.log(JSON.stringify(j, null, 2).slice(0, 3000));
              });
            "
          echo ""
          echo "--- latest deployments for ceo-dashboard project ---"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&limit=5&target=production" | node -e "
              let data=''; process.stdin.on('data', d => data+=d); process.stdin.on('end', () => {
                const j = JSON.parse(data);
                if (j.error) { console.log('ERROR', JSON.stringify(j.error)); process.exit(0); }
                for (const d of (j.deployments||[])) {
                  console.log(new Date(d.created||d.createdAt).toISOString(), d.state, d.url, d.meta && d.meta.githubCommitMessage ? d.meta.githubCommitMessage.split('\n')[0] : '');
                }
              });
            "
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
