name: tmp-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check hotlink protection with Referer header
        run: |
          urls="https://thumbnail.image.rakuten.co.jp/@0_mall/lensamigo/cabinet/johnson/1davms30-01p.jpg https://thumbnail.image.rakuten.co.jp/@0_mall/loook/cabinet/2609_evernatu_main.jpg https://thumbnail.image.rakuten.co.jp/@0_mall/zoff/cabinet/top_2/za201012_14e1.jpg"
          for u in $urls; do
            echo "=== $u ==="
            echo "-- no referer (baseline) --"
            curl -s -o /dev/null -D - "$u" | grep -iE "^HTTP|^content-type|^content-length"
            echo "-- with Referer: https://www.lens-navi.jp/ --"
            curl -s -o /dev/null -D - -e "https://www.lens-navi.jp/" "$u" | grep -iE "^HTTP|^content-type|^content-length"
            echo "-- with real browser User-Agent + Referer --"
            curl -s -o /dev/null -D - -e "https://www.lens-navi.jp/" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" "$u" | grep -iE "^HTTP|^content-type|^content-length"
            echo
          done
