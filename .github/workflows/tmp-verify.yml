name: tmp-verify
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run GA4 traffic source report
        run: |
          cat > /tmp/traffic-report.ts <<'SCRIPTEOF'
          import { BetaAnalyticsDataClient } from '@google-analytics/data';

          async function main() {
            const keyJson = process.env.GA4_SERVICE_ACCOUNT_KEY;
            if (!keyJson) throw new Error('GA4_SERVICE_ACCOUNT_KEY is not set');
            const credentials = JSON.parse(keyJson);
            const client = new BetaAnalyticsDataClient({ credentials });
            const propertyId = '520238223'; // lens-navi

            const [response] = await client.runReport({
              property: `properties/${propertyId}`,
              dateRanges: [{ startDate: '28daysAgo', endDate: 'today' }],
              dimensions: [{ name: 'sessionDefaultChannelGroup' }],
              metrics: [{ name: 'sessions' }, { name: 'totalUsers' }, { name: 'screenPageViews' }],
              orderBys: [{ metric: { metricName: 'sessions' }, desc: true }],
            });

            console.log('=== lens-navi 直近28日 流入元別セッション (sessionDefaultChannelGroup) ===');
            let total = 0;
            const rows = (response.rows ?? []).map(row => {
              const channel = row.dimensionValues?.[0]?.value ?? '(not set)';
              const sessions = Number(row.metricValues?.[0]?.value ?? 0);
              const users = Number(row.metricValues?.[1]?.value ?? 0);
              const pageviews = Number(row.metricValues?.[2]?.value ?? 0);
              total += sessions;
              return { channel, sessions, users, pageviews };
            });
            for (const r of rows) {
              console.log(`${r.channel}\tsessions=${r.sessions}\tusers=${r.users}\tpageviews=${r.pageviews}`);
            }
            console.log('合計セッション:', total);

            const [detail] = await client.runReport({
              property: `properties/${propertyId}`,
              dateRanges: [{ startDate: '28daysAgo', endDate: 'today' }],
              dimensions: [{ name: 'sessionSource' }, { name: 'sessionMedium' }],
              metrics: [{ name: 'sessions' }],
              orderBys: [{ metric: { metricName: 'sessions' }, desc: true }],
              limit: 20,
            });
            console.log('\n=== source / medium 内訳 (上位20) ===');
            for (const row of detail.rows ?? []) {
              const source = row.dimensionValues?.[0]?.value ?? '(not set)';
              const medium = row.dimensionValues?.[1]?.value ?? '(not set)';
              const sessions = row.metricValues?.[0]?.value ?? '0';
              console.log(`${source} / ${medium}\tsessions=${sessions}`);
            }
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          SCRIPTEOF
          npx tsx /tmp/traffic-report.ts
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
