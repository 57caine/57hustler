name: tmp-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: fetch homepage and extract featured product image URLs
        run: |
          curl -s "https://www.lens-navi.jp/" -o /tmp/home.html
          echo "=== raw <img> tags near featured products ==="
          grep -oE '<img[^>]*src="[^"]*"[^>]*>' /tmp/home.html | grep -i "rakuten\|thumbnail" || echo "NO rakuten/thumbnail img tags found"
          echo
          echo "=== all thumbnail.image.rakuten.co.jp URLs in HTML ==="
          grep -oE 'https://thumbnail\.image\.rakuten\.co\.jp[^"]*' /tmp/home.html | sort -u

      - name: check each image URL actually resolves
        run: |
          urls=$(grep -oE 'https://thumbnail\.image\.rakuten\.co\.jp[^"]*' /tmp/home.html | sort -u)
          if [ -z "$urls" ]; then
            echo "No image URLs extracted, skipping fetch checks"
          fi
          for u in $urls; do
            echo "--- $u ---"
            curl -s -o /dev/null -D - "$u" | grep -iE "^HTTP|^content-type|^location"
            echo
          done

      - name: check column list thumbnail markup
        run: |
          curl -s "https://www.lens-navi.jp/column" -o /tmp/column.html
          echo "=== img tags on /column ==="
          grep -oE '<img[^>]*>' /tmp/column.html | head -5 || echo "NO img tags on /column at all"
          echo "=== gradient thumbnail divs (expected pre-existing design) ==="
          grep -c "linear-gradient" /tmp/column.html
