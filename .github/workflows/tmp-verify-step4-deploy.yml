name: "[一時] STEP4本番反映確認"
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: curl /home/write-test (未認証でproxy.tsによりredirectされるはず)
        run: |
          STATUS=$(curl -sS -o /tmp/body.html -D /tmp/headers.txt -w "%{http_code}" -L --max-redirs 0 "https://ceo-dashboard-alpha-livid.vercel.app/home/write-test")
          echo "status=$STATUS"
          echo "--- headers ---"
          cat /tmp/headers.txt
          echo "--- redirect確認 ---"
          if [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ] || [ "$STATUS" = "302" ]; then
            LOCATION=$(grep -i '^location:' /tmp/headers.txt || true)
            echo "redirect先: $LOCATION"
            if echo "$LOCATION" | grep -q "/login"; then
              echo "RESULT: OK - /home/write-testルートが存在し、未認証は/loginへリダイレクトされる(=STEP4コードが本番に反映されている)"
            else
              echo "RESULT: unexpected redirect target"
            fi
          else
            echo "RESULT: unexpected status (expected 307/308/302 redirect to /login)"
          fi
