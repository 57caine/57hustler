name: A8 link identifier audit

on:
  pull_request:
    paths:
      - 'scripts/audit-a8-link-prefixes.mjs'
      - '.github/workflows/a8-link-identifier-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect selected A8 links (read-only)
        run: node scripts/audit-a8-link-prefixes.mjs
