name: Threads アクセストークン自動更新

on:
  schedule:
    - cron: '0 0 1,15 * *'   # 毎月1日・15日（60日の有効期限に対して十分な余裕を持って更新）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Threadsアクセストークン更新
        run: npx ts-node scripts/refresh-threads-token.ts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
