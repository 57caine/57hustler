name: 一時調査・アナリティクス配色修正の本番反映確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: デプロイ状態確認（直近3件）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=3&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.deployments[] | "\(.createdAt) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) msg=\(.meta.githubCommitMessage // "n/a" | split("\n")[0]) error=\(.errorMessage // "n/a")"'

      - name: 本番URL確認とページ内JS/HTML内容確認
        run: |
          echo "=== /analytics ==="
          curl -sSL -D - -o /tmp/an.html https://ceo-dashboard-alpha-livid.vercel.app/analytics
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/an.html || true
          echo "=== var(--accent)等のCSS変数ベース配色が使われているか（新JSバンドル内） ==="
          JS_PATH=$(grep -oE '/_next/static/chunks/app/analytics/page-[a-z0-9]+\.js' /tmp/an.html | head -1)
          echo "JS_PATH=$JS_PATH"
          if [ -n "$JS_PATH" ]; then
            curl -sSL "https://ceo-dashboard-alpha-livid.vercel.app$JS_PATH" -o /tmp/an.js
            echo "--- クリック率/クリック数 文言 ---"
            grep -o "クリック数\|クリック率" /tmp/an.js | sort -u
            echo "--- var(--accent) 等CSS変数参照 ---"
            grep -o "var(--accent)\|var(--muted)\|var(--text)" /tmp/an.js | sort -u
            echo "--- 旧bg-yellow-50/bg-gray-50が残っていないか ---"
            grep -o "bg-yellow-50\|bg-gray-50" /tmp/an.js | sort -u || echo "(残存なし)"
          fi
