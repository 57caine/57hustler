name: 一時調査・アナリティクス配色修正の本番反映確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: デプロイ状態確認（直近3件）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=3&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.deployments[] | "\(.createdAt) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) msg=\(.meta.githubCommitMessage // "n/a" | split("\n")[0]) error=\(.errorMessage // "n/a")"'

      - name: 本番HTML/JS内容確認
        run: |
          echo "=== /analytics ==="
          curl -sSL -D - -o /tmp/an.html https://ceo-dashboard-alpha-livid.vercel.app/analytics
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/an.html || true
          echo "=== 全JSチャンクを列挙 ==="
          grep -oE '/_next/static/chunks/[a-zA-Z0-9_/-]+\.js' /tmp/an.html | sort -u
          echo "=== 各チャンクからクリック数/クリック率・CSS変数配色・旧配色クラスを検索 ==="
          for path in $(grep -oE '/_next/static/chunks/[a-zA-Z0-9_/-]+\.js' /tmp/an.html | sort -u); do
            curl -sSL "https://ceo-dashboard-alpha-livid.vercel.app$path" -o /tmp/chunk.js
            if grep -q "クリック数\|クリック率" /tmp/chunk.js; then
              echo "--- $path ---"
              grep -o "クリック数\|クリック率" /tmp/chunk.js | sort -u
              echo "var(--accent)等: $(grep -o 'var(--accent)\|var(--muted)' /tmp/chunk.js | sort -u | tr '\n' ' ')"
              echo "旧bg-yellow-50/bg-gray-50: $(grep -o 'bg-yellow-50\|bg-gray-50' /tmp/chunk.js | sort -u | tr '\n' ' ')"
            fi
          done
