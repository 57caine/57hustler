name: Search acquisition read-only review
on:
  pull_request:
    paths:
      - 'scripts/fetch-search-acquisition.mjs'
      - 'rakutabi/components/ShareLinks.tsx'
      - '.github/workflows/search-acquisition-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'growth/search-acquisition-20261021')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read Google search and acquisition data (no submissions)
        run: node scripts/fetch-search-acquisition.mjs
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: search-acquisition
          path: artifacts/search-acquisition.json
          retention-days: 7
  travel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rakutabi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rakutabi/package-lock.json
      - run: npm ci
      - run: npm run build -- --webpack
