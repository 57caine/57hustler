name: ペット防災 公開（手動承認必須・noindex）

# 開発環境からは楽天API・Vercel API に直接アクセスできないため、Actions 上で行う。
#   1. 型チェック・lint
#   2. 楽天市場 商品検索APIから商品を取得（pet-bousai/data/products.json、コミットはしない）
#   3. Actions上でビルド・起動し、全ページ機械チェック＋スマホ実ブラウザ確認（実際の商品データ・画像で確認）
#   4. Vercelプロジェクト「pet-bousai」の固定vercel.appへ公開（本番エイリアス更新、独自ドメインは扱わない）
#   5. プレビューURLの全ページを機械チェック（noindex・広告表記・出典・楽天リンク属性・禁止表現・robots・sitemap）
#
# 2026-10-19: 公開前準備のみ。main + 手動 confirm_public_deploy=true の両方を満たすまで公開しない。
# 商品は毎日は更新しない（このワークフローを実行したときだけ取得する）。
on:
  workflow_dispatch:
    inputs:
      confirm_public_deploy:
        description: '本番vercel.appへ実際に公開する（オーナーの最終承認後のみtrue）'
        required: true
        type: boolean
        default: false

concurrency:
  group: pet-bousai-preview
  cancel-in-progress: false

jobs:
  preview:
    # 旧作業ブランチでは動かさない。mainかつ明示的な公開承認が必要。
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_deploy == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pet-bousai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pet-bousai/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: 型チェック・lint
        run: |
          npm run typecheck
          npm run lint

      - name: 楽天市場 商品検索APIから商品を取得
        run: npm run fetch:products
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}

      - name: Actions上でビルド・起動して全ページ機械チェック（実際の商品データ）
        run: |
          npm run build
          (npx next start -p 3100 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          npx tsx scripts/verify-site.ts http://localhost:3100 --expect-products

      - name: Actions上でスマホ表示・商品画像・affiliate_click の実ブラウザ確認
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/check-mobile.mjs http://localhost:3100

      - name: Vercelへプレビュー公開
        run: |
          set -o pipefail
          bash scripts/vercel-deploy.sh | tee /tmp/deploy.log
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: プレビューURLの全ページ機械チェック
        run: |
          url=$(grep -oE '^PREVIEW_URL=https://[^ ]+' /tmp/deploy.log | tail -1 | cut -d= -f2)
          if [ -z "${url}" ]; then echo "::error::プレビューURLが取得できませんでした"; exit 1; fi
          echo "確認URL: ${url}"
          echo "### 確認URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/verify-site.ts "${url}" --expect-products

      - name: 固定URL（vercel.app）の全ページ機械チェック
        run: |
          alias=$(grep -oE '^PRODUCTION_ALIAS=https://[^ ]+' /tmp/deploy.log | tail -1 | cut -d= -f2)
          if [ -z "${alias}" ]; then echo "固定URLなし（スキップ）"; exit 0; fi
          echo "固定URL: ${alias}"
          echo "### 固定URL: ${alias}" >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/verify-site.ts "${alias}" --expect-products

      - name: スマホ表示・商品画像・affiliate_click の実ブラウザ確認（公開URL）
        run: |
          # 公開処理（vercel build）で依存関係が入れ直され playwright が消えるため、ここで再度入れる
          npm i --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          url=$(grep -oE '^PREVIEW_URL=https://[^ ]+' /tmp/deploy.log | tail -1 | cut -d= -f2)
          node scripts/check-mobile.mjs "${url}"
