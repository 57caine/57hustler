name: ブランド別 Threads 通常投稿（11月18日まで検証）
on:
  schedule:
    # Multiple daily opportunities: missed GitHub schedule runs must not mean missed posts.
    # All times are UTC and remain on the same JST calendar day.
    - cron: '15 1,4,7,10 * * *'
    - cron: '15 6,8 * * 0'       # Sunday 15:15 and 17:15 JST
    - cron: '15 12,13 * * 2,4' # Tuesday/Thursday 21:15 and 22:15 JST
  workflow_run:
    workflows: ['価格データ・アフィリエイトリンク自動更新']
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: '手動実行時に公開する（通常はOFF）'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: brand-threads-organic-pilot
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 公開対象を日付で限定
        id: plan
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          case "$TODAY" in
            2026-10-14) BRAND=rakutabi; DAY=2 ;;
            2026-10-15) BRAND=lens; DAY=2 ;;
            2026-10-16) BRAND=rakutabi; DAY=3 ;;
            2026-10-17) BRAND=lens; DAY=3 ;;
            2026-10-20) BRAND=rakutabi; DAY=4 ;;
            2026-10-21) BRAND=lens; DAY=4 ;;
            2026-10-22) BRAND=rakutabi; DAY=5 ;;
            2026-10-23) BRAND=lens; DAY=5 ;;
            2026-10-24) BRAND=rakutabi; DAY=6 ;;
            2026-10-25) BRAND=lens; DAY=6 ;;
            2026-10-26) BRAND=rakutabi; DAY=7 ;;
            2026-10-28) BRAND=lens; DAY=7 ;;
            2026-10-29) BRAND=rakutabi; DAY=8 ;;
            2026-10-30) BRAND=lens; DAY=8 ;;
            2026-10-31) BRAND=rakutabi; DAY=9 ;;
            2026-11-01) BRAND=lens; DAY=9 ;;
            2026-11-02) BRAND=rakutabi; DAY=10 ;;
            2026-11-03) BRAND=lens; DAY=10 ;;
            2026-11-04) BRAND=rakutabi; DAY=11 ;;
            2026-11-05) BRAND=lens; DAY=11 ;;
            2026-11-06) BRAND=rakutabi; DAY=12 ;;
            2026-11-07) BRAND=lens; DAY=12 ;;
            2026-11-08) BRAND=rakutabi; DAY=13 ;;
            2026-11-09) BRAND=lens; DAY=13 ;;
            2026-11-10) BRAND=rakutabi; DAY=14 ;;
            2026-11-11) BRAND=lens; DAY=14 ;;
            2026-11-12) BRAND=rakutabi; DAY=15 ;;
            2026-11-13) BRAND=lens; DAY=15 ;;
            2026-11-14) BRAND=rakutabi; DAY=16 ;;
            2026-11-15) BRAND=lens; DAY=16 ;;
            2026-11-16) BRAND=rakutabi; DAY=17 ;;
            2026-11-17) BRAND=lens; DAY=17 ;;
            2026-11-18) BRAND=rakutabi; DAY=18 ;;
            *) echo "No scheduled content for $TODAY"; exit 0 ;;
          esac
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_run" ]]; then
            WEEKDAY="$(date -u -d "$TODAY" +%u)"
            SLOT=default
            if [[ "$BRAND" == rakutabi && "$TODAY" > 2026-11-05 ]]; then
              case "$WEEKDAY" in
                7) SLOT=sunday ;;
                2|4) SLOT=evening ;;
              esac
            fi
            JST_HOUR="$(TZ=Asia/Tokyo date +%H)"
            case "$SLOT" in
              sunday) START_HOUR=15 ;;
              evening) START_HOUR=21 ;;
              *) START_HOUR=10 ;;
            esac
            if (( 10#$JST_HOUR < START_HOUR )); then
              echo "Before planned audience window for $BRAND on $TODAY"; exit 0
            fi
            # Existing daily cron and trusted workflow completion share the same
            # day, serial group and full-history duplicate check. No old-day replay.
          fi
          echo "brand=$BRAND" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_run" || "$MANUAL_PUBLISH" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 通常投稿ドライラン
        if: ${{ steps.plan.outputs.brand != '' && steps.plan.outputs.publish != 'true' }}
        run: node scripts/post-organic-threads.mjs --brand "${{ steps.plan.outputs.brand }}" --day "${{ steps.plan.outputs.day }}"
      - name: アカウント・重複を検証して通常投稿
        if: ${{ steps.plan.outputs.brand != '' && steps.plan.outputs.publish == 'true' }}
        env:
          RAKUTABI_THREADS_USER_ID: ${{ secrets.RAKUTABI_THREADS_USER_ID }}
          RAKUTABI_THREADS_ACCESS_TOKEN: ${{ secrets.RAKUTABI_THREADS_ACCESS_TOKEN }}
          LENS_THREADS_USER_ID: ${{ secrets.LENS_THREADS_USER_ID }}
          LENS_THREADS_ACCESS_TOKEN: ${{ secrets.LENS_THREADS_ACCESS_TOKEN }}
          ENABLE_ORGANIC_THREADS_PUBLISH: 'true'
        run: node scripts/post-organic-threads.mjs --brand "${{ steps.plan.outputs.brand }}" --day "${{ steps.plan.outputs.day }}" --publish
