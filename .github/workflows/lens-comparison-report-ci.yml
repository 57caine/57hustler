name: Lens comparison measurement report
on:
  pull_request:
    paths:
      - 'scripts/fetch-ga4-analytics.ts'
      - 'scripts/lib/fetch-single-box-comparisons.mjs'
      - 'scripts/report-affiliate-evidence.mjs'
      - 'tests/single-box-comparison-report.test.mjs'
      - 'tests/affiliate-evidence-report.test.mjs'
      - '.github/workflows/lens-comparison-report-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/single-box-comparison-report.test.mjs tests/affiliate-evidence-report.test.mjs
