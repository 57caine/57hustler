name: Rakutabi click tracker PR checks

on:
  pull_request:
    paths:
      - 'rakutabi/components/ClickTracker.tsx'
      - 'rakutabi/package.json'
      - 'rakutabi/package-lock.json'
      - '.github/workflows/rakutabi-click-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rakutabi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rakutabi/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
