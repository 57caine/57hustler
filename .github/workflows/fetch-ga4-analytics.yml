name: GA4アナリティクス日次取得

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 6:00 JST (UTC 21:00 前日)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ga4-daily-analytics-main
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (needed for HTML-based affiliate link detection)
        run: npm run build

      - name: Fetch GA4 data
        run: npx tsx scripts/fetch-ga4-analytics.ts
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}

      - name: Validate generated analytics before commit
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = ['data/ga4-analytics.json', 'ceo-dashboard/public/ga4-analytics.json', 'data/column-review.json', 'ceo-dashboard/public/column-review.json'];
          for (const path of paths) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!data.generatedAt || !Number.isFinite(Date.parse(data.generatedAt))) throw new Error(`Invalid generatedAt: ${path}`);
            if (Date.now() - Date.parse(data.generatedAt) > 2 * 3600000) throw new Error(`Stale generatedAt: ${path}`);
          }
          const ga4 = JSON.parse(fs.readFileSync(paths[0], 'utf8'));
          const lens = (ga4.sites || []).find(site => site.siteName === 'lens-navi');
          if (!lens) throw new Error('lens-navi GA4 record missing');
          if (lens.affiliateClicksStatus !== 'ok') throw new Error('lens-navi affiliate_click query failed; refuse to publish misleading fresh GA4 snapshot');
          const review = JSON.parse(fs.readFileSync(paths[2], 'utf8'));
          if (review.autoReviewStale === true || review.affiliateClicksStatus !== 'ok') throw new Error('column review is stale or click query failed');
          console.log('Generated GA4 outputs validated');
          NODE

      - name: Commit analytics data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ga4-analytics.json ceo-dashboard/public/ga4-analytics.json \
            data/column-review.json ceo-dashboard/public/column-review.json
          if git diff --staged --quiet; then
            echo "No analytics changes to commit"
            exit 0
          fi
          git commit -m "chore: GA4アナリティクスデータ更新 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
          git pull --rebase origin main
          git push origin HEAD:main
