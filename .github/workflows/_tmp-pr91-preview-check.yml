name: TEMP PR91 Preview Check (delete after use)

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel preview base URL (no trailing slash)"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: curl status check
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          for path in / /projects /today /money; do
            code=$(curl -s -o /tmp/out_"$(echo $path | tr '/' '_')".html -w "%{http_code}" "$PREVIEW_URL$path")
            echo "GET $path -> HTTP $code"
          done
          echo "--- /projects body head (first 500 chars) ---"
          head -c 500 /tmp/out__projects.html || true

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.49.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Render check with real browser (JS fetch of raw.githubusercontent.com data)
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          cat > check.mjs << 'EOF'
          import { chromium } from 'playwright';

          const base = process.env.PREVIEW_URL;
          const browser = await chromium.launch();
          const page = await browser.newPage();

          async function check(path, label) {
            console.log(`\n=== ${label} (${path}) ===`);
            const resp = await page.goto(base + path, { waitUntil: 'networkidle', timeout: 30000 });
            console.log(`HTTP status: ${resp?.status()}`);
            await page.waitForTimeout(1500);
            const bodyText = await page.innerText('body');
            return bodyText;
          }

          try {
            const projectsText = await check('/projects', 'PROJECTS');
            const hasDesignOnlySection = projectsText.includes('設計中（未実装）');
            const hasActiveSection = projectsText.includes('稼働中');
            const hasStoppedSection = projectsText.includes('停止中');
            const hasPetHinan = /ペット防災|pet-hinan/i.test(projectsText);
            console.log(`[projects] 設計中（未実装）セクション表示: ${hasDesignOnlySection}`);
            console.log(`[projects] 稼働中セクション表示: ${hasActiveSection}`);
            console.log(`[projects] 停止中セクション表示: ${hasStoppedSection}`);
            console.log(`[projects] ペット防災プロジェクト名が本文に含まれる: ${hasPetHinan}`);
            console.log('--- projects body snippet (first 1200 chars) ---');
            console.log(projectsText.slice(0, 1200));

            const todayText = await check('/today', 'TODAY');
            const hasDesignOnlyCount = /設計中/.test(todayText);
            console.log(`[today] 設計中カウント表示: ${hasDesignOnlyCount}`);
            console.log('--- today body snippet (first 800 chars) ---');
            console.log(todayText.slice(0, 800));

            const moneyText = await check('/money', 'MONEY');
            console.log('--- money body snippet (first 800 chars) ---');
            console.log(moneyText.slice(0, 800));
            const moneyErrored = /データ未取得|Error|エラー/.test(moneyText) && !/未取得/.test('dummy');
            console.log(`[money] 明示的なエラー表示の有無: ${/データ未取得/.test(moneyText)}`);

          } catch (e) {
            console.error('CHECK FAILED:', e);
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          EOF
          node check.mjs
