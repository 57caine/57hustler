name: JARVIS tri-AI preflight checks
on:
  pull_request:
    paths:
      - 'ceo-dashboard/**'
      - '.github/workflows/jarvis-tri-ai-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ceo-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ceo-dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Run tri-AI contract checks
        run: |
          npx tsc lib/jarvis/tri-ai.contract.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/jarvis-check
          node -e "const r=require('/tmp/jarvis-check/tri-ai.contract.js').testTriAiContract(); console.log(r)"
      - name: Run answer routing regression checks
        run: |
          npx tsc lib/jarvis/answer-intent.contract.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/jarvis-intent
          node -e "console.log(require('/tmp/jarvis-intent/answer-intent.contract.js').testAnswerIntent())"
      - name: Run consensus MCP preproduction contract checks
        run: |
          npx tsc lib/consensus/mcp-contract.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-mcp
          node -e "const t=require('/tmp/consensus-mcp/mcp-contract.test.js'); console.log(t.testMcpContract()); t.testPkceExchangePrimitive().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth authorization-code exchange checks
        run: |
          npx tsc lib/consensus/oauth-code-exchange.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-oauth
          node -e "require('/tmp/consensus-oauth/oauth-code-exchange.test.js').testOAuthCodeExchange().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth authorization code issuance checks
        run: |
          npx tsc lib/consensus/oauth-code-issuance.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-issuance
          node -e "require('/tmp/consensus-issuance/oauth-code-issuance.test.js').testOAuthCodeIssuance().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth persistent-code adapter checks
        run: |
          npx tsc lib/consensus/oauth-code-store.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-oauth-store
          node -e "require('/tmp/consensus-oauth-store/oauth-code-store.test.js').testOAuthCodeStore().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run signed OAuth bearer checks
        run: |
          npx tsc lib/consensus/oauth-bearer.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-bearer
          node -e "require('/tmp/consensus-bearer/oauth-bearer.test.js').testOAuthBearer().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth end-to-end token primitive checks
        run: |
          npx tsc lib/consensus/oauth-token-flow.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-token-flow
          node -e "require('/tmp/consensus-token-flow/oauth-token-flow.test.js').testOAuthTokenFlow().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth MCP resource authorization checks
        run: |
          npx tsc lib/consensus/oauth-resource-authorization.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-resource-auth
          node -e "require('/tmp/consensus-resource-auth/oauth-resource-authorization.test.js').testOAuthResourceAuthorization().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth persistent revocation adapter checks
        run: |
          npx tsc lib/consensus/oauth-revocation-store.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-revocation
          node -e "require('/tmp/consensus-revocation/oauth-revocation-store.test.js').testOAuthRevocationStore().then(console.log).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run OAuth authorization request preflight checks
        run: |
          npx tsc lib/consensus/oauth-authorization-request.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-auth-request
          node -e "console.log(require('/tmp/consensus-auth-request/oauth-authorization-request.test.js').testAuthorizationRequest())"
      - name: Run OAuth consent binding negative checks
        run: |
          npx tsc lib/consensus/oauth-consent-binding.test.ts --module commonjs --target ES2020 --moduleResolution node --skipLibCheck --outDir /tmp/consensus-consent
          node -e "console.log(require('/tmp/consensus-consent/oauth-consent-binding.test.js').testOAuthConsentBinding())"
      - name: Next.js production build
        run: npm run build
