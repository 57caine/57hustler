name: Threads 今週のテーマ 自動投稿

on:
  schedule:
    # 毎日 JST 07:30 (UTC 22:30、前日扱い)。月曜判定はスクリプト内部で実施
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 今週のテーマ 投稿
        run: npx ts-node scripts/post-threads-weekly-theme.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
