name: 一時調査 楽天ウェブサービス規約・アフィリエイトガイドラインの確認

# 楽旅くんの口コミ抜粋表示が規約に反しないか確認するため、公式ページを取得して該当箇所をログに出すだけ。
# サイト・データは変更しない。確認後にこのファイルを削除する。
on:
  push:
    branches:
      - claude/tmp-rakuten-terms-check
    paths:
      - '.github/workflows/tmp-rakuten-terms-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 公式ページの取得と該当箇所の抽出
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for url in \
            https://webservice.rakuten.co.jp/guide/rule \
            https://webservice.rakuten.co.jp/guide/credit \
            https://webservice.rakuten.co.jp/documentation/hotel-detail-search \
            https://affiliate.rakuten.co.jp/guideline/rule/ \
            https://plaza.rakuten.co.jp/affiliatestaff/diary/202306140000/ \
            https://travel.rakuten.co.jp/info/overseas/uservoice.html \
            https://webservice.faq.rakuten.net/hc/ja/articles/900001974343 ; do
            echo "=================== ${url}"
            curl -sSL -A "${UA}" -o /tmp/p.html -w 'HTTP %{http_code} / %{size_download} bytes\n' "${url}"
            # タグを除いてテキスト化し、関係する語を含む文だけを出す
            python3 - <<'PY'
          import re, html
          s = open('/tmp/p.html', 'rb').read().decode('utf-8', 'replace')
          s = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', s)
          t = html.unescape(re.sub(r'<[^>]+>', '\n', s))
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.split('\n')]
          lines = [l for l in lines if l]
          print('text lines:', len(lines))
          kw = re.compile(r'口コミ|クチコミ|レビュー|お客さまの声|転載|複製|引用|保存|キャッシュ|クレジット|Supported by|表示義務|24時間|ヶ月|か月|userReview|トラベル')
          seen = set()
          for l in lines:
              if kw.search(l) and l not in seen and len(l) < 600:
                  seen.add(l); print('  ', l)
          PY
          done
