name: Growth automation safety checks
on:
  pull_request:
    paths:
      - 'scripts/growth-*.mjs'
      - 'scripts/ga4-growth-priorities.mjs'
      - '.github/workflows/growth-*.yml'
      - '.github/workflows/ga4-growth-priorities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-growth-automation.mjs
