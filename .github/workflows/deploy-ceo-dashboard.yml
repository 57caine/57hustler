name: Build CEO Dashboard

on:
  push:
    branches:
      - main
      - claude/bold-brahmagupta-uc9Mu
    paths:
      - 'ceo-dashboard/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ceo-dashboard/package-lock.json

      - name: Install dependencies
        run: cd ceo-dashboard && npm ci

      - name: Build
        run: cd ceo-dashboard && npm run build
