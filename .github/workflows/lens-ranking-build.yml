name: Lens ranking build validation

on:
  pull_request:
    paths:
      - 'app/ranking/page.tsx'
      - 'app/column/[slug]/page.tsx'
      - 'components/ProductCard.tsx'
      - '.github/workflows/lens-ranking-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
