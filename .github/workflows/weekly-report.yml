name: 週次レポート自動生成

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週日曜 22:00 UTC = 月曜 07:00 JST
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 週次レポートを生成
        run: npx ts-node scripts/weekly-report.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: レポートをコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/weekly-report/
          git diff --staged --quiet || git commit -m "chore: 週次レポート生成 $(date '+%Y-%m-%d' --utc)"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
