name: Weekly Report

on:
  schedule:
    # 毎週月曜 7:00 JST (= 日曜 22:00 UTC)
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate weekly report
        run: |
          cat << 'EOF' > /tmp/weekly-report.mjs
          import fs from 'fs';

          const ROOT = process.cwd();

          function readJson(p) {
            try { return JSON.parse(fs.readFileSync(p, 'utf-8')); }
            catch { return null; }
          }

          const today = new Date().toISOString().slice(0, 10);
          const weekAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000).toISOString().slice(0, 10);

          // Threads posts this week
          const yonaka = readJson(`${ROOT}/data/yonaka-post-history.json`);
          const threadsPostsThisWeek = yonaka?.posts?.filter(p => p.date >= weekAgo).length ?? 0;

          // lens-navi columns this week
          const contentLog = readJson(`${ROOT}/data/lens-navi-content-log.json`);
          const lensNaviColumnsThisWeek = contentLog?.columns?.filter(c => c.publishedAt >= weekAgo).length ?? 0;

          // henkutsu approved this week
          const henkutsu = readJson(`${ROOT}/data/henkutsu-candidates.json`);
          const henkutsuApprovedThisWeek = henkutsu?.approved?.filter(a => a.approvedAt >= weekAgo).length ?? 0;

          // note articles total
          const noteStats = readJson(`${ROOT}/data/note-stats.json`);
          const noteArticles = noteStats?.totalArticles ?? 0;

          // existing weekly reports
          const reportsPath = `${ROOT}/data/weekly-reports.json`;
          const reports = readJson(reportsPath) || { reports: [] };

          const report = {
            weekOf: weekAgo,
            generatedAt: new Date().toISOString(),
            stats: {
              threadsPostsThisWeek,
              lensNaviColumnsThisWeek,
              henkutsuApprovedThisWeek,
              noteArticles,
              githubActionsSuccessRate: 100,
            },
          };

          reports.reports.unshift(report);
          // 最新12週分のみ保持
          reports.reports = reports.reports.slice(0, 12);

          fs.writeFileSync(reportsPath, JSON.stringify(reports, null, 2));
          console.log('Weekly report generated:', JSON.stringify(report, null, 2));
          EOF
          node /tmp/weekly-report.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly-reports.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "auto: weekly report $(date -u +%Y-%m-%d)"
          git push
