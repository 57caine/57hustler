name: point-calendar キャンペーンデータ自動更新

on:
  workflow_dispatch:
  # TODO: mainマージ後、動作確認が取れ次第スケジュール実行を有効化する
  # schedule:
  #   - cron: '0 22 * * *'  # 07:00 JST
  #   - cron: '0 6 * * *'   # 15:00 JST

jobs:
  update-campaigns:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: point-calendar/package-lock.json

      - name: 依存関係インストール
        run: cd point-calendar && npm ci

      - name: Playwright ブラウザをインストール
        run: cd point-calendar && npx playwright install chromium --with-deps

      - name: キャンペーンデータ更新（実スクレイピング）
        run: cd point-calendar && npm run update-campaigns

      - name: 変更をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add point-calendar/data/campaigns.json
          git diff --staged --quiet || git commit -m "chore: point-calendarキャンペーンデータ自動更新 $(date '+%Y-%m-%d %H:%M JST')"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
