name: 一時調査・Vercel API診断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: デプロイ履歴一覧を取得
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=15" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/deployments.json
          echo "=== 件数 ==="
          jq '.deployments | length' /tmp/deployments.json
          echo "=== 一覧（新しい順） ==="
          jq -r '.deployments[] | "\(.createdAt | tostring) uid=\(.uid) state=\(.state) readyState=\(.readyState) target=\(.target) meta_commit=\(.meta.githubCommitSha // "n/a") meta_msg=\(.meta.githubCommitMessage // "n/a")"' /tmp/deployments.json
          echo "=== 生JSON（先頭3件） ==="
          jq '.deployments[0:3]' /tmp/deployments.json
