name: 一時調査・Vercel API診断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: プロジェクト情報を取得
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v9/projects?search=ceo-dashboard" -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/projects.json
          echo "=== id / name / accountId ==="
          jq -r '.projects[] | "id=\(.id) name=\(.name) accountId=\(.accountId)"' /tmp/projects.json
          echo "=== link (Git連携情報) ==="
          jq '.projects[] | {name, link}' /tmp/projects.json
          echo "=== 最新デプロイ（1件） ==="
          jq '.projects[] | {name, latestDeployment: .latestDeployments[0] | {uid, url, state, readyState, createdAt, source}}' /tmp/projects.json

      - name: チーム一覧を確認
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v2/teams" -H "Authorization: Bearer $VERCEL_TOKEN" | jq '.teams[] | {id, slug, name}'
