name: 一時調査・Vercel API診断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 対象コミットのデプロイ状況を確認
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/deployments.json
          echo "=== 総件数 ==="
          jq '.deployments | length' /tmp/deployments.json
          echo "=== 実コード変更コミットの検索結果 ==="
          for sha in a6eba42 d4bdb00 9c21d2e 8071958 cd16108 ad0523a 7a626a2 bc183e2; do
            echo "--- $sha ---"
            jq -r --arg sha "$sha" '.deployments[] | select(.meta.githubCommitSha // "" | startswith($sha)) | "state=\(.state) readyState=\(.readyState) target=\(.target) error=\(.errorMessage // "n/a") ref=\(.meta.githubCommitRef)"' /tmp/deployments.json
          done
          echo ""
          echo "=== 全件簡易一覧（古い方まで） ==="
          jq -r '.deployments[] | "\(.createdAt) \(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) ref=\(.meta.githubCommitRef // "n/a")"' /tmp/deployments.json
