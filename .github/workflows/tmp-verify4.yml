name: tmp-verify4
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Write check script
        run: |
          mkdir -p /tmp/pw
          cat > /tmp/pw/check.js <<'SCRIPT_EOF'
          const { chromium } = require('playwright');

          const DOMAIN = process.env.DOMAIN;
          const results = [];
          function R(k, v) { results.push(`${k} = ${v}`); }

          async function loadPage(browser, path, viewport) {
            const ctx = await browser.newContext({ viewport });
            const page = await ctx.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            const resp = await page.goto(`${DOMAIN}${path}`, { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(1500);
            const status = resp ? resp.status() : 0;
            const body = await page.textContent('body').catch(() => '');
            return { page, ctx, status, body, errors };
          }

          (async () => {
            const browser = await chromium.launch();
            const desktop = { width: 1280, height: 900 };
            const mobile = { width: 390, height: 844 };

            // /today
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/today', desktop);
              R('today.status', status);
              R('today.hasHeading_TOP3', body.includes('今日やることTOP3'));
              R('today.hasNoUrgent', body.includes('今日やるべき緊急事項はありません'));
              R('today.hasUserDecision', body.includes('ユーザー判断待ち'));
              R('today.hasAiWaiting', body.includes('AI作業待ち'));
              R('today.hasStalled', body.includes('長期間停滞'));
              R('today.hasStale', body.includes('未更新'));
              R('today.hasRevenueSection', body.includes('現在の収益状況'));
              R('today.hasProjectsSection', body.includes('プロジェクト') && body.includes('稼働中'));
              R('today.consoleErrors', errors.length);
              if (errors.length) R('today.errorSample', JSON.stringify(errors.slice(0, 3)));
              R('today.bodyLen', body.length);
              R('today.bodySnippet', JSON.stringify(body.slice(0, 400)));
              await ctx.close();
            }

            // /alert
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/alert', desktop);
              R('alert.status', status);
              R('alert.hasHeading', body.includes('自動検知'));
              const m = body.match(/全(\d+)件/);
              R('alert.totalCount', m ? m[1] : 'NOT_FOUND');
              R('alert.hasCategoryChips', body.includes('判断待ち') && body.includes('未更新'));
              R('alert.consoleErrors', errors.length);
              await ctx.close();
            }

            // /projects
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/projects', desktop);
              R('projects.status', status);
              for (const name of ['レンズナビ', '楽旅くん', 'ペット避難', '夜中のおじさん', '出口のノート', '雑草おじさん']) {
                R(`projects.has_${name}`, body.includes(name));
              }
              R('projects.hasActive', body.includes('稼働中'));
              R('projects.hasStoppedToggle', body.includes('停止中'));
              R('projects.consoleErrors', errors.length);
              await ctx.close();
            }

            // /projects/lens-navi (has GA4)
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/projects/lens-navi', desktop);
              R('detail.lensnavi.status', status);
              for (const label of ['目的', '現在の状態', 'KPI', 'ファネル', '問題', '仮説', 'PDCA', '次のアクション', '担当AI']) {
                R(`detail.lensnavi.has_${label}`, body.includes(label));
              }
              const sm = body.match(/(\d+)\s*セッション/);
              R('detail.lensnavi.sessionNumber', sm ? sm[1] : 'NOT_FOUND');
              R('detail.lensnavi.consoleErrors', errors.length);
              await ctx.close();
            }

            // /projects/rakutabi (no GA4 -> should show "未取得", not a fake 0)
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/projects/rakutabi', desktop);
              R('detail.rakutabi.status', status);
              R('detail.rakutabi.hasNoDataText', body.includes('未取得（GA4等のデータ連携なし）'));
              await ctx.close();
            }

            // /money
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/money', desktop);
              R('money.status', status);
              R('money.hasHeading', body.includes('収益ダッシュボード'));
              R('money.hasThisMonth', body.includes('今月収益'));
              R('money.hasLastMonth', body.includes('前月収益'));
              R('money.hasPerProject', body.includes('プロジェクト別収益'));
              R('money.hasCollectingBefore', body.includes('収集前'));
              R('money.consoleErrors', errors.length);
              await ctx.close();
            }

            // /ai-team
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/ai-team', desktop);
              R('aiteam.status', status);
              R('aiteam.hasChatGPT', body.includes('ChatGPT'));
              R('aiteam.hasClaude', body.includes('Claude'));
              R('aiteam.hasGemini', body.includes('Gemini'));
              R('aiteam.hasRealClaudeTask', body.includes('AIチーム司令塔化改修'));
              R('aiteam.consoleErrors', errors.length);
              await ctx.close();
            }

            // /pdca
            {
              const { ctx, status, body, errors } = await loadPage(browser, '/pdca', desktop);
              R('pdca.status', status);
              for (const label of ['仮説', '実行', '結果', '改善案', '次のアクション']) {
                R(`pdca.has_${label}`, body.includes(label));
              }
              R('pdca.hasResultNotAutoFilledNote', body.includes('自動生成しません'));
              R('pdca.hasNextActionAlertNote', body.includes('次のアクション未設定」で検知'));
              R('pdca.consoleErrors', errors.length);
              await ctx.close();
            }

            // Mobile check on /today
            {
              const { ctx, page, status, body, errors } = await loadPage(browser, '/today', mobile);
              R('mobile.today.status', status);
              R('mobile.today.hasHeading', body.includes('今日やることTOP3'));
              const scrollW = await page.evaluate(() => document.documentElement.scrollWidth);
              const clientW = await page.evaluate(() => document.documentElement.clientWidth);
              R('mobile.today.scrollWidth', scrollW);
              R('mobile.today.clientWidth', clientW);
              R('mobile.today.hasHorizontalOverflow', scrollW > clientW + 5);
              const navVisible = await page.evaluate(() => {
                const nav = document.querySelector('nav');
                if (!nav) return false;
                const r = nav.getBoundingClientRect();
                return r.width > 0 && r.height > 0;
              });
              R('mobile.today.navVisible', navVisible);
              R('mobile.today.consoleErrors', errors.length);
              await ctx.close();
            }

            // Mobile nav click test on /projects
            {
              const { ctx, page } = await loadPage(browser, '/projects', mobile);
              const link = page.locator('a[href="/pdca"]').first();
              const count = await link.count();
              R('mobile.nav.pdcaLinkCount', count);
              if (count > 0) {
                await link.click();
                await page.waitForTimeout(1000);
                R('mobile.nav.afterClickUrl', page.url());
              }
              await ctx.close();
            }

            await browser.close();
            console.log(results.join('\n'));
          })().catch(e => { console.error('FATAL', e); process.exit(1); });
          SCRIPT_EOF
          echo "wrote $(wc -l < /tmp/pw/check.js) lines"

      - name: Install playwright (isolated, no project deps)
        timeout-minutes: 6
        run: |
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/tmp/pw_install.log 2>&1 || (tail -150 /tmp/pw_install.log && exit 1)
          npx playwright install --with-deps chromium

      - name: Run production checks
        timeout-minutes: 4
        run: node /tmp/pw/check.js
        env:
          DOMAIN: https://ceo-dashboard-alpha-livid.vercel.app
