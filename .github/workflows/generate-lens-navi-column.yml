name: Generate Lens-Navi Column

on:
  schedule:
    # JST 9:00 (00:00 UTC) — 3本生成: contact / karakon / eye-goods
    - cron: '0 0 * * *'
    # JST 13:00 (04:00 UTC) — 2本生成: vr / megane
    - cron: '0 4 * * *'
    # JST 19:00 (10:00 UTC) — 2本生成: lasik / eye-care
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      section:
        description: 'Section: contact / eye-care / lasik / megane / vr / karakon / eye-goods'
        required: false
        default: 'contact'
      count:
        description: 'Number of columns to generate (1-3)'
        required: false
        default: '1'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Morning batch: JST 9:00 → contact / karakon / eye-goods (×3) ──
      - name: Morning batch (×3)
        if: github.event.schedule == '0 0 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/generate-lens-navi-column.ts --section contact
          npx tsx scripts/generate-lens-navi-column.ts --section karakon
          npx tsx scripts/generate-lens-navi-column.ts --section eye-goods

      # ── Noon batch: JST 13:00 → vr / megane (×2) ──
      - name: Noon batch (×2)
        if: github.event.schedule == '0 4 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/generate-lens-navi-column.ts --section vr
          npx tsx scripts/generate-lens-navi-column.ts --section megane

      # ── Evening batch: JST 19:00 → lasik / eye-care (×2) ──
      - name: Evening batch (×2)
        if: github.event.schedule == '0 10 * * *'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/generate-lens-navi-column.ts --section lasik
          npx tsx scripts/generate-lens-navi-column.ts --section eye-care

      # ── Manual dispatch ──
      - name: Manual generate
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          COUNT=${{ github.event.inputs.count || '1' }}
          SECTION=${{ github.event.inputs.section || 'contact' }}
          if [ "$SECTION" = "all" ]; then
            for s in contact karakon vr eye-care lasik megane eye-goods; do
              for i in $(seq 1 $COUNT); do
                npx tsx scripts/generate-lens-navi-column.ts --section $s || true
              done
            done
          else
            for i in $(seq 1 $COUNT); do
              npx tsx scripts/generate-lens-navi-column.ts --section $SECTION || true
            done
          fi

      - name: Compliance check summary
        if: always()
        run: |
          node -e "
            const q = require('./data/column-review-queue.json');
            const held = q.items.filter(i => i.flaggedAt === new Date().toISOString().slice(0,10));
            if (held.length > 0) {
              console.log('::warning::公開前チェックで ' + held.length + ' 件がレビュー待ちになりました（data/column-review-queue.json を確認してください）');
              held.forEach(i => console.log(' - ' + i.slug + ': ' + i.title));
            } else {
              console.log('公開前チェックで保留になった記事はありません');
            }
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            lib/columns.tsx \
            lib/eye-columns.tsx \
            lib/karakon-columns.tsx \
            data/lens-navi-content-log.json \
            data/column-review-queue.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: lens-navi column generation $(date +%Y-%m-%d-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && \
            git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 2))
          done
