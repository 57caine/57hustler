name: TEMP CEO Dashboard prod baseline check (delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl production CEO dashboard (baseline, read-only)
        run: |
          BASE="https://ceo-dashboard-alpha-livid.vercel.app"
          for path in / /projects /today /money; do
            echo "=== GET $BASE$path ==="
            curl -sS -D - -o /tmp/body.html "$BASE$path" | head -20
            echo "--- body length: $(wc -c < /tmp/body.html) bytes ---"
            echo "--- body head (300 chars) ---"
            head -c 300 /tmp/body.html
            echo ""
            echo ""
          done
