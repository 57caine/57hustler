name: 一時調査・タスク一覧タブ最終確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: デプロイ状態確認（直近3件）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=3&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.deployments[] | "\(.createdAt) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) msg=\(.meta.githubCommitMessage // "n/a" | split("\n")[0]) error=\(.errorMessage // "n/a")"'

      - name: /tasks ページ確認
        run: |
          echo "=== /tasks ==="
          curl -sSL -D - -o /tmp/tasks.html https://ceo-dashboard-alpha-livid.vercel.app/tasks
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/tasks.html || true
          echo "=== ナビにタスク一覧タブがあるか ==="
          grep -o "タスク一覧" /tmp/tasks.html | sort -u

      - name: /api/tasks 実データ確認
        run: |
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" https://ceo-dashboard-alpha-livid.vercel.app/api/tasks
