name: Lens-Navi Self Improvement (read-only audit)

on:
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read-only content audit (no AI API, commits, or deploys)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const log = JSON.parse(fs.readFileSync('data/lens-navi-content-log.json', 'utf8'));
          const columns = log.columns || [];
          const counts = {};
          for (const col of columns) counts[col.section || 'unknown'] = (counts[col.section || 'unknown'] || 0) + 1;
          const sorted = columns.filter(x => x.publishedAt).sort((a,b) => a.publishedAt.localeCompare(b.publishedAt));
          const lines = [
            '## Lens-Navi weekly content audit (read-only)',
            '',
            'Total logged articles: ' + columns.length,
            'Oldest: ' + (sorted[0]?.slug || 'none'),
            'Section counts:',
            ...Object.entries(counts).sort((a,b) => a[0].localeCompare(b[0])).map(([section,count]) => '- ' + section + ': ' + count),
            '',
            'No content generated, no changes pushed, no paid AI API called.'
          ];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
