name: Build lens-navi / school-navi / yonaka-uranai

on:
  push:
    branches:
      - main
      - claude/bold-brahmagupta-uc9Mu
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'data/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'school-navi/**'
      - 'shikaku-navi/**'
      - 'yonaka-uranai/**'
  workflow_dispatch:

jobs:
  build-lens-navi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build lens-navi
        run: npm run build

  build-school-navi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: school-navi/package-lock.json

      - name: Install dependencies
        run: cd school-navi && npm ci

      - name: Build school-navi
        run: cd school-navi && npm run build

  build-yonaka-uranai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yonaka-uranai/package-lock.json

      - name: Install dependencies
        run: cd yonaka-uranai && npm ci

      - name: Build yonaka-uranai
        run: cd yonaka-uranai && npm run build
