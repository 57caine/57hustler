name: Deploy lens-navi to Vercel

on:
  push:
    branches:
      - main
      - claude/bold-brahmagupta-uc9Mu
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'data/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bold-brahmagupta-uc9Mu
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
