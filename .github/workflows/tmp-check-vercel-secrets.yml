name: 一時調査・Vercel関連シークレット確認

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: シークレットの有無を確認（値は一切表示しない）
        env:
          T1: ${{ secrets.VERCEL_TOKEN }}
          T2: ${{ secrets.VERCEL_API_TOKEN }}
          T3: ${{ secrets.VERCEL_ORG_ID }}
          T4: ${{ secrets.VERCEL_PROJECT_ID }}
          T5: ${{ secrets.VERCEL_PROJECT_ID_CEO_DASHBOARD }}
          T6: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          check() {
            if [ -n "$2" ]; then echo "$1: 設定あり（長さ${#2}文字）"; else echo "$1: 未設定"; fi
          }
          check "VERCEL_TOKEN" "$T1"
          check "VERCEL_API_TOKEN" "$T2"
          check "VERCEL_ORG_ID" "$T3"
          check "VERCEL_PROJECT_ID" "$T4"
          check "VERCEL_PROJECT_ID_CEO_DASHBOARD" "$T5"
          check "VERCEL_TEAM_ID" "$T6"
