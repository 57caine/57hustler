name: tmp-price-lookup
on:
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch mujina product pages (follow redirects, dump raw body)
        run: |
          for slug in mujina0008 mj-1092; do
            echo "===== $slug ====="
            curl -sS -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              "https://item.rakuten.co.jp/mujina/${slug}/" -o /tmp/page.html -w "HTTP %{http_code} final_url=%{url_effective}\n" --max-time 20
            wc -c /tmp/page.html
            echo "--- raw body (first 2000 chars) ---"
            head -c 2000 /tmp/page.html
            echo
            echo "--- end raw body ---"
            echo
          done
