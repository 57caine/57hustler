name: tmp-price-lookup
on:
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch mujina product pages and extract price hints
        run: |
          for slug in mujina0008 mj-1092; do
            echo "===== $slug ====="
            curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              "https://item.rakuten.co.jp/mujina/${slug}/" -o /tmp/page.html -w "HTTP %{http_code}\n"
            wc -c /tmp/page.html
            echo "--- itemprop=price ---"
            grep -oE 'itemprop="price"[^>]*content="[0-9]+"' /tmp/page.html | head -5
            echo "--- og:price ---"
            grep -oE '"price":\s*"?[0-9]+' /tmp/page.html | head -5
            echo "--- yen patterns near price-ish class/id ---"
            grep -oE '(price|Price)[^0-9]{0,40}[0-9]{3,6}' /tmp/page.html | head -10
            echo "--- raw 円 occurrences ---"
            grep -oE '[0-9]{3,6}\s*円' /tmp/page.html | sort -u | head -10
            echo
          done
