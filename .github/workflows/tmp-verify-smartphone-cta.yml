name: 一時確認-スマホ老眼CTA本番反映確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production page and check CTA content
        run: |
          URL="https://lens-navi.jp/column/smartphone-presbyopia-magnifier-eyeglasses"
          echo "Fetching: $URL"
          HTTP_CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: unexpected status code"
            exit 1
          fi
          echo ""
          echo "=== ボタン文言チェック ==="
          grep -o "ハズキルーペを楽天で見る" /tmp/page.html | sort | uniq -c
          grep -o "JINS SCREENを楽天で見る" /tmp/page.html | sort | uniq -c
          echo ""
          echo "=== デザイン区別チェック（タイプ別セクションのoutlineボタン） ==="
          grep -c "border-\[#bf0000\] text-\[#bf0000\]" /tmp/page.html || true
          echo ""
          echo "=== デザイン区別チェック（早見表直下・まとめ末尾の塗りつぶしボタン） ==="
          grep -c "bg-cyan-900 text-cyan-100" /tmp/page.html || true
