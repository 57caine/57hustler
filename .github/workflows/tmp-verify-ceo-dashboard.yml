name: 一時調査・CEOダッシュボード本番確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 本番URLをcurlで確認（コンテキスト付き）
        run: |
          curl -sS -D - -o /tmp/body.html https://ceo-dashboard-alpha-livid.vercel.app/
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/body.html
          echo "=== 削除対象文字列（累計投稿数・note公開数・雑草ストック等） ==="
          grep -o "累計投稿数\|note公開数\|雑草ストック\|次の投稿まで\|今日の投稿数" /tmp/body.html || echo "該当なし（削除確認OK）"
          echo "=== アナリティクス の前後文脈 ==="
          grep -o '.\{40\}アナリティクス.\{40\}' /tmp/body.html || echo "見つかりませんでした"
          echo "=== クイックリンク セクションの中身 ==="
          grep -o '.\{20\}クイックリンク.\{500\}' /tmp/body.html || true
