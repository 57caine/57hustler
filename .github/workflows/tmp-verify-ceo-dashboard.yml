name: 一時調査・CEOダッシュボード本番確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 本番URLをcurlで確認
        run: |
          curl -sS -D - -o /tmp/body.html https://ceo-dashboard-alpha-livid.vercel.app/
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/body.html || true
          echo "=== 削除対象文字列（累計投稿数・note公開数） ==="
          grep -o "累計投稿数\|note公開数" /tmp/body.html | sort -u || echo "該当なし"
          echo "=== クイックリンクに改善レビュー・アナリティクスがあるか ==="
          grep -o '.\{20\}クイックリンク.\{600\}' /tmp/body.html || true
