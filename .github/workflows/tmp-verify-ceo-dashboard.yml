name: 一時調査・CEOダッシュボード本番確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 本番URLをcurlで確認（コンテキスト付き）
        run: |
          curl -sS -o /tmp/body.html https://ceo-dashboard-alpha-livid.vercel.app/
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/body.html
          echo "=== 累計投稿数 の前後文脈 ==="
          grep -o '.\{80\}累計投稿数.\{80\}' /tmp/body.html || true
          echo "=== 改善レビュー の前後文脈 ==="
          grep -o '.\{80\}改善レビュー.\{80\}' /tmp/body.html || true
          echo "=== アナリティクス の前後文脈 ==="
          grep -o '.\{80\}アナリティクス.\{80\}' /tmp/body.html || true
          echo "=== クイックリンク の前後文脈 ==="
          grep -o '.\{40\}クイックリンク.\{300\}' /tmp/body.html || true
