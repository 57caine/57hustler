name: 楽天キャンペーン構造 診断（1回限りの手動実行用）

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose-rakuten-campaigns.ts'
      - '.github/workflows/diagnose-rakuten-campaigns.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: Playwright ブラウザをインストール
        run: npx playwright install chromium --with-deps

      - name: 楽天キャンペーン構造を調査
        run: npx ts-node scripts/diagnose-rakuten-campaigns.ts
