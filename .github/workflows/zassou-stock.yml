name: 雑草おじさん DMMストック自動生成

on:
  schedule:
    # 1日3回: 9:00 / 15:00 / 21:00 JST (= 0:00 / 6:00 / 12:00 UTC)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（ファイル書き込みなし）'
        required: false
        default: 'false'
      repair_parents:
        description: '親投稿を全件新プロンプトで再生成する'
        required: false
        default: 'false'

jobs:
  generate-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate DMM stock
        env:
          DMM_API_ID:        ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:  ${{ secrets.DMM_AFFILIATE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ]      && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.repair_parents }}" = "true" ] && ARGS="$ARGS --repair-parents"
          npx ts-node scripts/zassou-stock-generator.ts $ARGS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/zassou-stock.json \
            data/zassou-stock.csv
          if git diff --cached --quiet; then
            echo "No new items to commit"
            exit 0
          fi
          ITEM_COUNT=$(node -e "const d=require('./data/zassou-stock.json'); console.log(d.totalCount)")
          git commit -m "auto: 雑草ストック更新 $(date +%Y-%m-%d) 合計${ITEM_COUNT}件"
          git pull --rebase origin main
          git push

      - name: Sync to Google Sheets
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          ZASSOU_SHEET_ID:         ${{ secrets.ZASSOU_SHEET_ID }}
        run: npx ts-node scripts/sync-zassou-to-sheets.ts
