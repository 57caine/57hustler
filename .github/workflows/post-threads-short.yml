name: Threads 夜21時 自動投稿（一文考察・夜占い）

on:
  # 14日間の1日2投稿テスト中は定期実行を停止。手動実行のみ許可。
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 夜21時投稿（月・水・金：夜占い／火・木・土・日：一文考察）
        run: npx ts-node scripts/post-threads-short.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
