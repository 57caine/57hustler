name: Threads 夜21時 自動投稿（一文考察・夜占い）

on:
  # 14日間の1日2投稿テスト中は定期実行を停止。手動実行のみ許可。
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 夜21時投稿（月・水・金：夜占い／火・木・土・日：一文考察）
        run: npx ts-node scripts/post-threads-short.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: 投稿履歴をコミット（重複投稿防止用）
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/yonaka-short-post-history.json
          git diff --staged --quiet || git commit -m "chore: Threads夜21時投稿履歴更新 $(date '+%Y-%m-%d')"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
