name: 一時調査・Vercel READY履歴確認

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: READY状態のデプロイ履歴
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=20&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.deployments[] | "\(.createdAt) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) msg=\(.meta.githubCommitMessage // "n/a" | split("\n")[0])"'

      - name: 26b672d8デプロイのフル詳細
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/deps.json
          DEPID=$(jq -r '.deployments[] | select(.meta.githubCommitSha=="26b672d8afbd7388465689606d2aa654114962c9") | .uid' /tmp/deps.json)
          echo "DEPID=$DEPID"
          curl -sS "https://api.vercel.com/v13/deployments/$DEPID?teamId=team_3ZA38DTbe02rLyjHXAaNuCs5" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/detail.json
          jq '{id, state, readyState, createdAt, buildingAt, target, errorMessage, gitSource: .gitSource, buildSkipped}' /tmp/detail.json
