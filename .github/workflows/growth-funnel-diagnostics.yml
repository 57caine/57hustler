name: Growth funnel daily diagnostics
on:
  schedule:
    - cron: '30 23 * * *' # 08:30 JST
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/growth-funnel-diagnostics.mjs'
      - '.github/workflows/growth-funnel-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/growth-funnel-diagnostics.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-diagnostics
          path: growth-reports/latest.json
          retention-days: 14
