name: 一時確認-処方箋記事の表示確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production page and inspect
        run: |
          URL="https://lens-navi.jp/column/contact-dosu-shohosen-mikata-kanzen-2026"
          echo "Fetching: $URL"
          HTTP_CODE=$(curl -sL -o /tmp/page.html -w "%{http_code}" "$URL")
          echo "HTTP status: $HTTP_CODE"
          echo "File size: $(wc -c < /tmp/page.html) bytes"
          echo ""
          echo "=== エラー兆候の確認 ==="
          grep -o "Application error\|500 Internal\|This page could not be found\|__next_error__" /tmp/page.html || echo "エラー文言なし"
          echo ""
          echo "=== titleタグの確認 ==="
          grep -o "<title>[^<]*</title>" /tmp/page.html
          echo ""
          echo "=== 先頭2500文字（articleタグ以降を含む） ==="
          head -c 2500 /tmp/page.html
