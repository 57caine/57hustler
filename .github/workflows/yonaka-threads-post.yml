name: Threads 夜中のおじさん 自動投稿

on:
  schedule:
    - cron: '0 13 * * *'   # 毎日 JST 22:00 (UTC 13:00)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ネタ生成・Threads投稿
        run: npx ts-node scripts/yonaka-generate-post.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: 投稿履歴をコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/yonaka-post-history.json
          git diff --staged --quiet || git commit -m "chore: 夜中のおじさん投稿履歴更新 $(date '+%Y-%m-%d')"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)
          git push
