name: 一時調査・lens-naviデプロイ失敗の緊急調査

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 本番URL確認（新デプロイが実際に配信されているか）
        run: |
          curl -sSL -D - -o /tmp/home.html https://lens-navi.jp/ | head -30
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/home.html || true

      - name: lens-naviプロジェクトの最新production alias確認
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_giumlnQKdnPBBAKU6l5t81ol54AV&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=1&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.deployments[0] | "\(.uid) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8])"'
