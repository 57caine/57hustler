name: tmp-verify-auth
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploy status (ceo-dashboard, extended history)
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&limit=10&target=production" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
                const j = JSON.parse(d);
                for (const dep of j.deployments) console.log(new Date(dep.created).toISOString(), dep.state, dep.uid, (dep.meta && dep.meta.githubCommitSha||'').slice(0,7), dep.meta && dep.meta.githubCommitMessage ? dep.meta.githubCommitMessage.split('\n')[0] : '');
              });
            "
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Detailed status of the a64b556 and 6094c86 deployments
        run: |
          for sha in a64b556 6094c86; do
            echo "===== commit $sha ====="
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&limit=20" | node -e "
                let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
                  const j = JSON.parse(d);
                  const target = j.deployments.find(dep => (dep.meta && dep.meta.githubCommitSha||'').startsWith('$sha'));
                  console.log(target ? JSON.stringify({uid: target.uid, state: target.state, target: target.target, errorMessage: target.errorMessage}, null, 2) : 'not found in last 20');
                });
              "
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
