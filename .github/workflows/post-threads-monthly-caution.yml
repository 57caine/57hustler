name: Threads 今月の注意点 自動投稿

on:
  schedule:
    # 毎日 JST 07:15 (UTC 22:15、前日扱い)。毎月1日判定はスクリプト内部で実施
    - cron: '15 22 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 今月の注意点 投稿
        run: npx ts-node scripts/post-threads-monthly-caution.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
