name: 一時調査・改善レビューページの本番反映確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: デプロイ状態確認（直近5件）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=5&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.deployments[] | "\(.createdAt) state=\(.state) sha=\(.meta.githubCommitSha // "n/a" | .[0:8]) msg=\(.meta.githubCommitMessage // "n/a" | split("\n")[0]) error=\(.errorMessage // "n/a")"'

      - name: 最新デプロイのv13フル詳細（buildSkipped確認）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=1&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/deps.json
          LATEST_ID=$(jq -r '.deployments[0].uid' /tmp/deps.json)
          curl -sS "https://api.vercel.com/v13/deployments/$LATEST_ID?teamId=team_3ZA38DTbe02rLyjHXAaNuCs5" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq '{id, readyState, createdAt, buildingAt, ready, target, buildSkipped, errorMessage}'

      - name: 最新デプロイのビルドイベントログ
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          LATEST_ID=$(jq -r '.deployments[0].uid' /tmp/deps.json)
          echo "LATEST_ID=$LATEST_ID"
          curl -sS "https://api.vercel.com/v3/deployments/$LATEST_ID/events?teamId=team_3ZA38DTbe02rLyjHXAaNuCs5&limit=200" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.[] | "\(.created // .date // "") \(.type // "") \(.payload.text // .text // "")"' | tail -80

      - name: aliasの状態確認
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          LATEST_ID=$(jq -r '.deployments[0].uid' /tmp/deps.json)
          curl -sS "https://api.vercel.com/v2/deployments/$LATEST_ID/aliases?teamId=team_3ZA38DTbe02rLyjHXAaNuCs5" \
            -H "Authorization: Bearer $VERCEL_TOKEN"
          echo ""

      - name: 新規APIルート（approve-fix / reject-fix）の疎通確認
        run: |
          echo "=== approve-fix（不正なslugで400/500系の構造化エラーが返るか） ==="
          curl -sS -o /tmp/approve.json -w "HTTP_CODE:%{http_code}\n" \
            -X POST https://ceo-dashboard-alpha-livid.vercel.app/api/column-review/approve-fix \
            -H "Content-Type: application/json" -d '{"slug":"__no_such_slug__","prNumber":999999}'
          cat /tmp/approve.json
          echo ""
          echo "=== reject-fix（同様） ==="
          curl -sS -o /tmp/reject.json -w "HTTP_CODE:%{http_code}\n" \
            -X POST https://ceo-dashboard-alpha-livid.vercel.app/api/column-review/reject-fix \
            -H "Content-Type: application/json" -d '{"slug":"__no_such_slug__","prNumber":999999,"branch":"nope"}'
          cat /tmp/reject.json

      - name: 本番URL確認（column-reviewページが正常に200を返すか）
        run: |
          echo "=== /column-review ==="
          curl -sSL -D - -o /tmp/cr.html https://ceo-dashboard-alpha-livid.vercel.app/column-review
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/cr.html || true
          echo "=== ページ内テキストの一部（クライアントレンダリングのため見出し文言のみ確認） ==="
          grep -o "改善レビュー\|Column Improvement Review" /tmp/cr.html | sort -u
