name: tmp-verify3
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy status
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_B033Bkfsk6LkJZNxS61Gc4Xvddva&limit=3&target=production" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
                const j = JSON.parse(d);
                for (const dep of j.deployments) console.log(new Date(dep.created).toISOString(), dep.state, (dep.meta && dep.meta.githubCommitSha||'').slice(0,7));
              });
            "
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Full curl-based content verification
        run: |
          DOMAIN="https://ceo-dashboard-alpha-livid.vercel.app"

          fetch_full () {
            local path="$1"
            local out="$2"
            curl -sS -o /tmp/page.html -w "HTTP %{http_code}\n" "${DOMAIN}${path}"
            : > "$out"
            cat /tmp/page.html >> "$out"
            echo "" >> "$out"
            for u in $(grep -oE '"/_next/static/[a-zA-Z0-9_./%-]+\.js"' /tmp/page.html | tr -d '"' | sort -u) \
                     $(grep -oE 'href="/_next/static/[a-zA-Z0-9_./%-]+\.js"' /tmp/page.html | sed -E 's/href="//;s/"$//' | sort -u); do
              curl -sS "${DOMAIN}${u}" >> "$out" 2>/dev/null || true
              echo "" >> "$out"
            done
          }

          check () {
            local file="$1"; shift
            for s in "$@"; do
              cnt=$(grep -ocF "$s" "$file" 2>/dev/null || echo 0)
              echo "    [$s]: $cnt"
            done
          }

          echo "===== /today ====="
          fetch_full "/today" /tmp/today_all.txt
          wc -c /tmp/today_all.txt
          check /tmp/today_all.txt "TOP3" "決めることは3つです" "判断待ち" "ALERT該当" "AI TEAM" "PROJECTS" "MONEY" "PDCA" "57hustler CEO Dashboard"

          echo "===== /alert ====="
          fetch_full "/alert" /tmp/alert_all.txt
          check /tmp/alert_all.txt "自動検知" "全" "条件" "TODAY"

          echo "===== /projects ====="
          fetch_full "/projects" /tmp/projects_all.txt
          check /tmp/projects_all.txt "全" "プロジェクト" "稼働中" "停止中" "レンズナビ" "楽旅くん" "ペット避難" "夜中のおじさん" "出口のノート" "雑草おじさん" "収益" "流入" "未取得"

          echo "===== /projects/lens-navi ====="
          fetch_full "/projects/lens-navi" /tmp/detail_all.txt
          check /tmp/detail_all.txt "目的" "現在の状態" "ファネル" "問題" "仮説" "次のアクション" "担当AI" "セッション"

          echo "===== /money ====="
          fetch_full "/money" /tmp/money_all.txt
          check /tmp/money_all.txt "収益ダッシュボード" "今月収益" "前月収益" "プロジェクト別収益" "クリック" "収集前" "目標未設定"

          echo "===== /ai-team ====="
          fetch_full "/ai-team" /tmp/aiteam_all.txt
          check /tmp/aiteam_all.txt "ChatGPT" "Claude" "Gemini" "AIチーム司令塔化改修" "未設定" "手動で更新"

          echo "===== /pdca ====="
          fetch_full "/pdca" /tmp/pdca_all.txt
          check /tmp/pdca_all.txt "仮説" "実行" "結果" "改善案" "次のアクション" "自動では埋めない" "空欄"

          echo "===== redirects ====="
          for p in "/" "/column-review" "/tasks" "/report-log" "/analytics"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${DOMAIN}${p}")
            loc=$(curl -sS -o /dev/null -D - "${DOMAIN}${p}" | grep -i "^location" | tr -d '\r')
            echo "  $p -> $code $loc"
          done

      - name: RSC payload snippet for TODAY (separate step, safe indentation)
        run: |
          curl -sS "https://ceo-dashboard-alpha-livid.vercel.app/today" -o /tmp/today_raw.html
          node -e "
            const fs = require('fs');
            const data = fs.readFileSync('/tmp/today_raw.html', 'utf-8');
            const idx = data.indexOf('self.__next_f.push');
            console.log('first push idx:', idx);
            if (idx >= 0) console.log(data.slice(idx, idx + 3000));
          "
