name: 一時調査・トップページCSSクラスの本番確認

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 本番HTML取得
        run: |
          curl -sSL -D - https://lens-navi.jp/ -o /tmp/home.html
          echo "=== dpl-id ==="
          grep -o 'data-dpl-id="[^"]*"' /tmp/home.html || true
          echo "=== カテゴリアイコンの円背景クラス ==="
          grep -oE 'bg-sky-[0-9]+ text-sky-[0-9]+ transition-colors group-hover:bg-sky-[0-9]+' /tmp/home.html | head -3
          echo "=== 商品カードのshadow/borderクラス（FeaturedProducts） ==="
          grep -oE 'rounded-2xl border border-slate-100 bg-white shadow-[a-z]+ transition-shadow hover:shadow-[a-z]+' /tmp/home.html | head -3
          echo "=== カテゴリカードのshadow/borderクラス ==="
          grep -oE 'rounded-2xl border border-slate-100 bg-white p-5 text-center shadow-[a-z]+ transition-shadow hover:shadow-[a-z]+' /tmp/home.html | head -3
