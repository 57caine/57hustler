/* 熟ドロ テスト版。配色: 黒・深紅・金・ピンク（2026-11-08 オーナー合意）

:root{color-scheme:dark;--bg:#080406;--ink:#fff5df;--red:#ff2469;--muted:#c5aaa6;--line:#64302f;--gold:#ffe4a4;--sub:#b68a65;--card:linear-gradient(180deg,#230d16,#170b10);--card-line:#703044;--btn:linear-gradient(180deg,#ff548e,#ff1761)}

.wrap{max-width:1040px;margin:auto;padding:14px 20px}
.ad-note{margin:0 0 6px;font-size:10px;color:var(--sub);text-align:right}

/* 特集カルーセル（3枠） */
.carousel{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:10px;border-radius:12px;scrollbar-width:none}

.slide{flex:0 0 100%;scroll-snap-align:start;min-height:168px;padding:18px 22px;border:1px solid #b38742;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:inset 0 0 28px #6b142022}
.slide[data-i="0"]{background:radial-gradient(ellipse at top right,#7c112e,transparent 65%),linear-gradient(110deg,#3f090b,#20050b)}

.slide[data-i="2"]{background:radial-gradient(ellipse at top right,#6a2110,transparent 65%),linear-gradient(110deg,#361107,#170909);border-color:#b17d31}
.slide-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:#edc16b;font-weight:bold}
.slide h2{font:bold 22px/1.35 sans-serif;margin:4px 0;color:#fff0c8;text-shadow:0 2px 8px #0008;text-wrap:balance}
.slide p{color:#e1c2b8;font-size:11px;margin:0}
.slide-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mix{font-size:10px;color:#efd4b5;font-variant-numeric:tabular-nums}
.slide-btn{border:0;border-radius:20px;padding:8px 16px;min-height:40px;background:var(--btn);color:#fff;font-weight:800;box-shadow:inset 0 1px #ffb1cc55}

.more-btn{display:block;width:100%;min-height:34px;border:0;background:var(--btn);color:#fff;font-weight:800;font-size:11px}
.sample:not(.real) .more-btn{margin:0 -8px;width:calc(100% + 16px)}
.play{position:absolute;left:8px;top:calc(var(--arth) - 38px);z-index:2;display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:3px 10px;border:1px solid #fff6;border-radius:16px;background:#000a;color:#fff;font-size:11px;font-weight:bold}
.play:after{content:'';position:absolute;inset:-6px}
.play-lg{top:auto;bottom:14px;left:50%;transform:translateX(-50%);min-height:44px;padding:6px 18px;font-size:13px}
.sample{position:absolute;left:0;right:0;top:0;height:var(--arth);z-index:4;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px 8px 0;color:#fff;background:linear-gradient(120deg,var(--b),#2a0715,var(--b),#140b0b);background-size:300% 100%;animation:pan 6s linear infinite}

.bar{display:block;height:4px;margin:4px -8px 0;background:#fff3}
.bar i{display:block;height:100%;width:0;background:var(--red);animation:prog linear forwards}
@keyframes pan{to{background-position:300% 0}}
@keyframes prog{to{width:100%}}
@media (prefers-reduced-motion:reduce){.sample{animation:none}}
.card-foot{display:flex;flex-direction:column;gap:6px;padding:0 9px 9px}

.art{position:relative;overflow:hidden;display:block;height:170px;background:linear-gradient(145deg,var(--b),#140b0b);border-bottom:1px solid #6b2d3e}
.art:before{content:'';position:absolute;width:110px;height:150px;bottom:-16px;left:calc(50% - 55px);border-radius:50% 50% 8% 8%;background:linear-gradient(150deg,#f4e3ce99,#b17a7277);box-shadow:20px 0 40px #301c2922;transform:rotate(-8deg);opacity:.5}
.art:after{content:attr(data-initial);position:absolute;left:12px;bottom:10px;color:#f9cde0;font:italic 22px Georgia}

.rank+.badge{left:38px}
.save{position:absolute;right:8px;top:8px;width:27px;height:27px;border:0;border-radius:50%;background:#fffc;color:#ed255b;font-size:17px;line-height:1;z-index:2}
.save:after{content:'';position:absolute;inset:-9px}/* 見た目27px・押せる範囲45px */

function fromApi(x,i,fetchedAt){
  const days=x.date?(new Date(fetchedAt)-new Date(x.date.replace(' ','T')))/864e5:999;
  return {id:x.id,title:x.title,prov:'FANZA',cat:x.cat,cats:x.cats||[x.cat],who:(x.actresses||[]).slice(0,2).join('・')||x.maker||'',roman:'',theme:'',
    summary:[x.maker?`メーカー：${x.maker}`:'',x.actresses?.length?`出演：${x.actresses.join('・')}`:''].filter(Boolean).join(' ／ '),
    b:PALETTE[i%PALETTE.length],isNew:days<=30,pop:1000-(x.rank||i),tags:(x.tags||[]).filter(t=>!TAG_SKIP.test(t)).slice(0,8),order:i,demo:false,
    url:x.url,image:x.image,sampleMovie:x.sampleMovie,price:x.price,listPrice:x.listPrice,campaign:x.campaign,maker:x.maker,date:x.date};
}
function buildWorks(meta){

  /* 取得した実データは全件表示する（Fantiaが架空6件のため 7:3 にはならない。Fantiaの扱いが決まるまでの暫定） */
  if(real.length){fanza=real.map((x,i)=>fromApi(x,i,meta.fetchedAt));DATA={real:true,fetchedAt:meta.fetchedAt,total:real.length}}
  W=[...fanza,...fantia].map((w,i)=>({...w,order:i}));

}

/* ===== 送客イベント（テスト環境内に記録。本番ではGA4等へ送る想定） ===== */
function track(name,params){
  const ev={event:name,...params,page:location.hash||'#',ts:new Date().toISOString()};
  const log=store.get('jd-events',[]);log.push(ev);store.set('jd-events',log.slice(-300));
  (window.dataLayer=window.dataLayer||[]).push(ev);
  return ev;
}

function filtered(){
  const q=S.q.trim().toLowerCase(),f=FEATURES.find(x=>x.id===S.feature);
  return W.filter(w=>(S.view!=='saved'||saved.has(w.id))&&(S.prov==='all'||w.prov===S.prov)&&(S.cat==='すべて'||w.cats.includes(S.cat))&&(!S.tag||w.tags.includes(S.tag))&&(!f||f.test(w))
    &&[w.title,w.prov,...w.cats,w.who,w.roman,w.theme,w.summary,...w.tags].some(t=>t.toLowerCase().includes(q)))
   .sort({pop:(a,b)=>b.pop-a.pop,new:(a,b)=>(b.isNew-a.isNew)||a.order-b.order,title:(a,b)=>a.title.localeCompare(b.title,'ja')}[S.sort]);

function watchCta(){io?.disconnect();const m=$('#mainCta');if(!m||!('IntersectionObserver' in window))return;

  $('#logView').innerHTML=`<div class="panel" style="max-width:none"><a class="back" href="#" data-back>← 一覧に戻る</a><h1>送客イベントログ（テスト環境）</h1>
<p>詳細表示（view_item）、サンプル再生（sample_play）、タグ選択（select_tag）、掲載先ボタンのクリック（outbound_click）を、このブラウザ内に記録しています。外部には送信していません。</p>
<div class="sum"><span>サンプル再生: ${log.filter(e=>e.event==='sample_play').length}</span><span>タグ選択: ${log.filter(e=>e.event==='select_tag').length}</span><span>クリック合計: ${clicks.length}</span>${cnt('provider')}${cnt('position')}${cnt('entry_source')}</div>
<div class="logwrap"><table><thead><tr><th>時刻</th><th>イベント</th><th>作品ID</th><th>提供元</th><th>ボタン位置</th><th>経路</th><th>一覧の順位</th><th>絞り込み</th></tr></thead><tbody>
${log.slice().reverse().map(e=>`<tr><td>${e.ts.slice(11,19)}</td><td>${e.event}</td><td>${e.work_id||'—'}${e.tag?' #'+esc(e.tag):''}</td><td>${e.provider||'—'}</td><td>${e.position||'—'}</td><td>${e.entry_source||e.from_view||'—'}</td><td>${e.list_index||'—'}</td><td>${esc(e.filters||'—')}</td></tr>`).join('')||'<tr><td colspan="8">まだ記録がありません</td></tr>'}
</tbody></table></div>
<div class="row"><button class="ghost" data-clear-log>ログを消去</button></div>
<h1 style="margin-top:18px;font-size:15px">本番反映の前に確認すること</h1>
<ul class="checklist"><li>画像の利用条件（各提供元のアフィリエイト規約・素材の掲載可否）</li><li>広告表記（PR表記の位置と文言、ステマ規制への対応）</li><li>リンク先（作品ごとの掲載先URLとアフィリエイトID）</li><li>計測設定（GA4のイベント名・パラメータ、rel="sponsored"）</li><li>年齢確認の画面</li></ul></div>`;
}

/* ===== サンプル動画（テスト用の仮映像。本番は提供元が許可するサンプル動画の埋め込みに置き換える） ===== */
let sampleTimer=null;
function stopSample(){clearTimeout(sampleTimer);document.querySelectorAll('.sample').forEach(e=>e.remove())}
function playSample(b){
  stopSample();const w=findW(b.dataset.play),box=b.closest('.card')||b.closest('.art');
  const el=document.createElement('div');el.className='sample';el.style.setProperty('--b',w.b);el.setAttribute('role','region');el.setAttribute('aria-label',w.title+'のサンプル動画（仮）');
  const more=`<button class="more-btn" data-go="${w.id}" data-pos="sample_overlay" data-src="${b.dataset.pos==='detail'?'':b.dataset.pos.replace('_card','')}" data-idx="${b.closest('.card')?.querySelector('[data-idx]')?.dataset.idx||''}">続きは本編で ▶ ${BUY_BTN[w.prov]}</button>`;
  el.innerHTML=w.sampleMovie
    ?`<iframe src="${esc(w.sampleMovie)}" title="${esc(w.title)}のサンプル動画" allow="autoplay; fullscreen" allowfullscreen scrolling="no"></iframe><button class="sample-stop" data-stop aria-label="サンプルを止める">■ 閉じる</button>${more}`
    :`<span class="sample-label">サンプル再生中（仮映像）</span><span class="sample-title">${esc(w.title)}</span><button class="sample-stop" data-stop aria-label="サンプルを止める">■ 停止</button><span class="bar"><i style="animation-duration:${SAMPLE_SEC}s"></i></span>${more}`;
  if(w.sampleMovie)el.classList.add('real');
  box.appendChild(el);
  track('sample_play',{work_id:w.id,provider:w.prov,position:b.dataset.pos,entry_source:b.dataset.pos==='detail'?(entry?.src||'direct'):b.dataset.pos.replace('_card',''),list_index:null,filters:''});
  if(!w.sampleMovie)sampleTimer=setTimeout(()=>{el.classList.add('done');el.querySelector('.sample-label').textContent='サンプル終了';},SAMPLE_SEC*1000);
}

/* ===== 画面の切り替え ===== */
function show(v){stopSample();['listView','detailView','confirmView','logView'].forEach(id=>$('#'+id).hidden=id!==v+'View');if(v!=='detail'){$('#stickyCta').hidden=true;document.body.classList.remove('has-sticky')}}
function route(){
  const h=location.hash.slice(1),prev=current;let m;
  if(prev==='list')S.scroll=scrollY,saveState();
  if((m=h.match(/^w-([a-z0-9_]+)$/))&&findW(m[1])){
    const w=findW(m[1]);current='detail';show('detail');
    entry=store.get('jd-entry',null,true);if(!entry||entry.id!==w.id){entry={id:w.id,src:'direct',at:Date.now()};store.set('jd-entry',entry,true)}
    renderDetail(w);document.title=`${w.title}｜熟ドロ`;scrollTo(0,0);watchCta();
    if(entry.tracked!==entry.at){track('view_item',{work_id:w.id,provider:w.prov,entry_source:entry.src,list_index:entry.idx||null,filters:entry.filters||''});entry.tracked=entry.at;store.set('jd-entry',entry,true)}
  }else if((m=h.match(/^go-([a-z0-9_]+)$/))&&findW(m[1])){
    const w=findW(m[1]);current='confirm';show('confirm');lastConfirmEv=lastEv&&lastEv.work_id===w.id?lastEv:null;renderConfirm(w,lastConfirmEv);lastEv=null;document.title='掲載先の確認（テスト）｜熟ドロ';scrollTo(0,0);
  }else if(h==='log'){current='log';show('log');renderLog();document.title='送客イベントログ｜熟ドロ';scrollTo(0,0)}
  else{current='list';show('list');renderList();goSlide(S.slide,false);document.title='熟女泥棒｜熟ドロ';if(prev!=='list')requestAnimationFrame(()=>scrollTo(0,S.scroll))}
}
function filterLabel(){const f=FEATURES.find(x=>x.id===S.feature);return [S.view==='saved'?'保存':'',f?f.id:'',S.prov!=='all'?S.prov:'',S.cat!=='すべて'?S.cat:'',S.tag?'#'+S.tag:'',S.q?`「${S.q}」`:'',S.sort].filter(Boolean).join(' / ')}
function toList(){if(current!=='list'){history.pushState(null,'',location.pathname+location.search);route()}}

/* ===== 操作 ===== */
document.addEventListener('click',e=>{
  const op=e.target.closest('a[data-open]');
  if(op){const w=findW(op.dataset.open);track('outbound_open',{work_id:w.id,provider:w.prov,position:'confirm',entry_source:lastConfirmEv?.entry_source||'direct',list_index:lastConfirmEv?.list_index||null,filters:''});return}
  const a=e.target.closest('a[data-w]');
  if(a){store.set('jd-entry',{id:a.dataset.w,src:a.dataset.src,idx:+a.dataset.idx,filters:a.dataset.src==='list'?filterLabel():'',at:Date.now()},true);return}
  const back=e.target.closest('[data-back]');
  if(back){e.preventDefault();toList();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.save){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);store.set('jd-saved-works',[...saved]);if(current==='detail'){renderDetail(findW(location.hash.slice(3)));watchCta()}else renderList();return}
  if(b.dataset.go){const w=findW(b.dataset.go),fromCard=!!b.dataset.src&&b.dataset.idx!=='';
    const src=fromCard?b.dataset.src:(entry?.src||'direct'),idx=fromCard?+b.dataset.idx:(entry?.idx||null),flt=fromCard?(b.dataset.src==='list'?filterLabel():''):(entry?.filters||'');
    stopSample();lastEv=track('outbound_click',{work_id:w.id,provider:w.prov,position:b.dataset.pos,entry_source:src,list_index:idx||null,filters:flt});location.hash='go-'+w.id;return}
  if(b.dataset.play){playSample(b);return}
  if(b.dataset.stop!==undefined){stopSample();return}
  if(b.dataset.tag){track('select_tag',{tag:b.dataset.tag,work_id:b.dataset.from||'',provider:b.dataset.from?findW(b.dataset.from).prov:'',from_view:current});
    Object.assign(S,{tag:S.tag===b.dataset.tag&&current==='list'&&!b.dataset.from?null:b.dataset.tag,view:'all',feature:null,q:'',cat:'すべて',prov:'all',limit:PAGE});
    if(current!=='list'){S.scroll=0;toList()}else renderList();requestAnimationFrame(()=>requestAnimationFrame(()=>$('#listing').scrollIntoView({behavior:'smooth'})));return}
  if(b.hasAttribute('data-tag-clear')){S.tag=null;S.limit=PAGE;renderList();return}
  if(b.dataset.prov){S.prov=b.dataset.prov;S.limit=PAGE;renderList();return}
  if(b.dataset.cat){S.cat=b.dataset.cat;S.limit=PAGE;renderList();return}
  if(b.dataset.feature){const f=FEATURES.find(x=>x.id===b.dataset.feature);Object.assign(S,{feature:f.id,sort:f.sort,q:'',prov:'all',cat:'すべて',tag:null,view:'all',limit:PAGE});renderList();$('#listing').scrollIntoView({behavior:'smooth'});return}
  if(b.hasAttribute('data-feature-clear')){S.feature=null;S.limit=PAGE;renderList();return}
  if(b.hasAttribute('data-more')){S.limit=(S.limit||PAGE)+PAGE;renderList();track('list_more',{shown:S.limit,filters:filterLabel()});return}
  if(b.dataset.car){goSlide(S.slide+(b.dataset.car==='next'?1:-1));return}
  if(b.dataset.dot){goSlide(+b.dataset.dot);return}
  if(b.hasAttribute('data-clear-log')){store.set('jd-events',[]);renderLog();return}
  if(b.dataset.nav){toList();Object.assign(S,{view:b.dataset.nav==='saved'?'saved':'all',feature:null,tag:null,q:'',prov:'all',cat:'すべて',limit:PAGE});renderList();(b.dataset.nav==='ranking'?$('#ranking'):$('#listing')).scrollIntoView({behavior:'smooth'})}
});
let st;$('#track').addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const t=$('#track');setDot(Math.round(t.scrollLeft/(t.clientWidth+10)))},80)});
$('#track').addEventListener('keydown',e=>{if(e.key==='ArrowRight')goSlide(S.slide+1);if(e.key==='ArrowLeft')goSlide(S.slide-1)});
$('#searchForm').onsubmit=e=>{e.preventDefault();S.q=$('#query').value;renderList();$('#query').blur()};
$('#query').oninput=()=>{S.q=$('#query').value;S.limit=PAGE;renderList()};
$('#sort').onchange=()=>{S.sort=$('#sort').value;S.limit=PAGE;renderList()};
addEventListener('hashchange',route);
addEventListener('resize',()=>goSlide(S.slide,false));
if('scrollRestoration' in history)history.scrollRestoration='manual';
(async()=>{
  let meta=null;try{const r=await fetch('data/fanza.json',{cache:'no-store'});if(r.ok)meta=await r.json()}catch{}
  buildWorks(meta);
  saved=new Set(store.get('jd-saved-works',[]).filter(id=>W.some(w=>w.id===id)));
  $('#dataNote').textContent=DATA.real?`FANZAの作品情報：DMMアフィリエイトAPIで取得（${new Date(DATA.fetchedAt).toLocaleString('ja-JP')}）。Fantiaは架空データです。`:'作品データを読み込めなかったため、架空データを表示しています。';
  renderCarousel();route();
})();
</script></body></html>
