</style></head><body><div class="test">PRIVATE PREVIEW ・ 架空データによるテストサイト</div><header><div class="head"><div class="logo">熟女泥棒<small>熟ドロ / JUKUDORO</small></div><nav aria-label="メインメニュー"><button class="active" data-view="all">クリエイターを探す</button><button data-view="feature">特集</button><button data-view="saved">保存した一覧 <span id="saveCount">0</span></button></nav></div></header><main class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">A LITTLE MORE, YOUR STYLE.</div><h1>気になる特集、<br>まとめて見つかる。</h1><p>雰囲気やテーマから探す、クリエイターの特集室。<br>熟ドロがつなぐ、あなただけのお気に入り。</p></div><div class="hero-art" role="img" aria-label="落ち着いた色合いの抽象的なアーチ"></div></section><form class="search" id="searchForm"><input id="query" aria-label="名前やテーマで検索" placeholder="名前・雰囲気・テーマから探す" type="search"><button>検索する</button></form><div class="chips" aria-label="テーマで絞り込み"></div><div class="ticker"><b>熟ドロ PICK UP</b><span>気になる特集を保存して、あとでまとめてチェック。</span></div><section id="features"><div class="section-top"><div><h2>熟ドロの特集室</h2><p>EDITOR'S COLLECTION</p></div></div><div class="feature"><button data-filter="落ち着いた雰囲気"><small>COLLECTION 01</small>余韻を楽しむ、大人の時間。<span>落ち着いた雰囲気で選ぶ →</span></button><button data-filter="ナチュラル"><small>COLLECTION 02</small>飾らない魅力に、出会う。<span>ナチュラルな雰囲気で選ぶ →</span></button></div></section><section id="listing"><div class="section-top"><div><h2 id="listTitle">クリエイターを探す</h2><p id="result" aria-live="polite"></p></div><select id="sort" aria-label="表示順"><option value="new">新着順</option><option value="name">名前順</option></select></div><div class="grid" id="grid"></div></section><div class="extra" id="extraSections"></div><footer>熟女泥棒 / 熟ドロ<br>本ページの人物・情報・ビジュアルはすべて架空のデモです。<br>© JUKUDORO — PRIVATE TEST</footer></main><dialog id="dialog"><button class="close" aria-label="閉じる">×</button><div id="modal"></div></dialog><script>
const entries=[['彩花','Ayaka','落ち着いた雰囲気','穏やかな語り口と、丁寧な日々の発信。','#c2a392','#816765'],['沙織','Saori','ナチュラル','飾らない日常を、自分のペースで。','#9ca698','#5d736b'],['美月','Mizuki','上品','さりげないこだわりが光る、特集ノート。','#bbb0bb','#73667f'],['遥','Haruka','日常','暮らしの中の、小さな楽しみを集めて。','#c5ac83','#8b7056'],['凛','Rin','落ち着いた雰囲気','静かな時間を大切にするクリエイター。','#b19199','#694c60'],['佳奈','Kana','ナチュラル','自然体の言葉でつづる、日々の記録。','#b2b3a2','#737866'],['千尋','Chihiro','上品','好きなものを、少しずつ深く。','#acb5bd','#647583'],['由衣','Yui','日常','何気ない瞬間に見つける、いつもの魅力。','#c4ab9f','#986f62']].map((a,i)=>({id:i,name:a[0],roman:a[1],tag:a[2],description:a[3],a:a[4],b:a[5]}));let saved=new Set;try{saved=new Set(JSON.parse(localStorage.getItem('jd-saved')||'[]').filter(x=>Number.isInteger(x)&&x>=0&&x<entries.length))}catch{}let filter='すべて',view='all';const grid=document.querySelector('#grid'),query=document.querySelector('#query'),dialog=document.querySelector('#dialog');function render(){let list=entries.filter(x=>(filter==='すべて'||x.tag===filter)&&(view!=='saved'||saved.has(x.id))&&[x.name,x.roman,x.tag,x.description].some(t=>t.toLowerCase().includes(query.value.trim().toLowerCase())));if(document.querySelector('#sort').value==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));document.querySelector('#result').textContent=`${list.length}人のデモクリエイター`;document.querySelector('#saveCount').textContent=saved.size;document.querySelector('#listTitle').textContent=view==='saved'?'保存したクリエイター':'クリエイターを探す';grid.innerHTML=list.length?list.map(x=>`<article class="card"><div class="art" style="--a:${x.a};--b:${x.b}" data-initial="${x.roman}"><span class="badge">DEMO CREATOR</span><button class="save" aria-label="${x.name}を保存" aria-pressed="${saved.has(x.id)}" data-save="${x.id}">${saved.has(x.id)?'♥':'♡'}</button></div><div class="card-body"><div class="tag">${x.tag}</div><h3>${x.name} <span style="font:10px sans-serif;color:#998b80">${x.roman}</span></h3><p>${x.description}</p><button class="detail" data-detail="${x.id}">特集を見る <span>↗</span></button></div></article>`).join(''):'<div class="empty">条件に合うクリエイターがいません。<br>検索語や絞り込みを変えてみてください。</div>';document.querySelector('#extraSections').innerHTML=view==='all'&&!query.value&&filter==='すべて'?['注目の特集','今週のピックアップ','クリエイター一覧'].map((title,index)=>`<section><div class="section-top"><div><h2>${title}</h2><p>JUKUDORO SELECTION / DEMO</p></div></div><div class="grid">${entries.slice(index, index+4).map((x,i)=>`<article class="card"><div class="art" style="--a:${x.a};--b:${x.b}" data-initial="${x.roman}"><span class="rank">${i+1}</span><span class="badge">DEMO</span></div><div class="card-body"><div class="tag">${x.tag}</div><h3>${x.name}の特集</h3><p>${x.description}</p><button class="detail" data-detail="${x.id}">特集をチェック <span>→</span></button></div></article>`).join('')}</div><button class="more" data-view="feature">特集一覧をもっと見る →</button></section>`).join(''):'';document.querySelector('.chips').innerHTML=['すべて','落ち着いた雰囲気','ナチュラル','上品','日常'].map(t=>`<button class="${filter===t?'active':''}" aria-pressed="${filter===t}" data-filter="${t}">${t}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.save!==undefined){const id=Number(b.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('jd-saved',JSON.stringify([...saved]))}catch{}render()}if(b.dataset.detail!==undefined){const x=entries[Number(b.dataset.detail)];document.querySelector('#modal').innerHTML=`<div class="art" style="--a:${x.a};--b:${x.b}" data-initial="${x.roman}"></div><div class="dialog-body"><div class="eyebrow">CREATOR SPOTLIGHT / DEMO</div><h2>${x.name}の特集室</h2><p>${x.description}</p><dl><dt>テーマ</dt><dd>${x.tag}</dd><dt>掲載状態</dt><dd>架空データ・テスト掲載</dd><dt>更新内容</dt><dd>プロフィール・作品一覧の表示見本</dd></dl><div class="notice">本番では、許諾と掲載条件を確認した情報・素材をここに掲載します。外部サービスの接続は準備段階です。</div></div>`;dialog.showModal()}if(b.dataset.view){view=b.dataset.view;filter='すべて';query.value='';document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('active',n.dataset.view===view));render();if(view==='feature')document.querySelector('#features').scrollIntoView({behavior:'smooth'});if(view==='saved')document.querySelector('#listing').scrollIntoView({behavior:'smooth'})}});document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();render()};query.oninput=render;document.querySelector('#sort').onchange=render;render();
</script></body></html>
